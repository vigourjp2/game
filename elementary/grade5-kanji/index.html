<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>小5 漢字｜手書き自動認識テスト</title>
<style>
:root{--bg:#0f172a;--ink:#f8fafc;--muted:#cbd5e1;--line:#334155;--pri:#2563eb;--ok:#16a34a;--ng:#dc2626;--warn:#f97316}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.top{padding:5px 8px calc(5px + env(safe-area-inset-top));background:linear-gradient(180deg,rgba(15,23,42,.98),rgba(15,23,42,.82));border-bottom:1px solid var(--line)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.title{font-weight:900;font-size:13px;color:#93c5fd}.badge{border:1px solid var(--line);background:#1e293b;border-radius:999px;padding:4px 7px;font-size:11px;font-weight:900;color:#dbeafe}
.q{font-weight:900;font-size:clamp(15px,4.1vw,24px);line-height:1.22;margin-top:4px;white-space:pre-line;max-height:5.2em;overflow:auto}.sub{font-size:11px;color:var(--muted);font-weight:800;margin-top:3px;line-height:1.25}.score{margin-left:auto;color:#cbd5e1;font-weight:900;font-size:12px}
.canvasWrap{position:relative;min-height:0;background:#fff;touch-action:none;overflow:hidden}
#kanjiCanvas{display:block;width:100%;height:100%;background:#fff;touch-action:none;cursor:crosshair}
.guide{pointer-events:none;position:absolute;inset:0;background:
linear-gradient(to right,transparent calc(50% - .5px),rgba(148,163,184,.45) calc(50% - .5px),rgba(148,163,184,.45) calc(50% + .5px),transparent calc(50% + .5px)),
linear-gradient(to bottom,transparent calc(50% - .5px),rgba(148,163,184,.45) calc(50% - .5px),rgba(148,163,184,.45) calc(50% + .5px),transparent calc(50% + .5px))}
.guide:before{content:"";position:absolute;inset:4px;border:2px dashed rgba(148,163,184,.45);border-radius:18px}
.ghost{pointer-events:none;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(62vw,62vh);font-weight:900;color:rgba(15,23,42,.055);line-height:1}
.resultBox{display:none;position:absolute;left:10px;right:10px;bottom:10px;max-height:78vh;overflow:auto;background:rgba(15,23,42,.94);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:12px;box-shadow:0 14px 40px rgba(0,0,0,.28)}
.resultBox.open{display:block}.resultMain{font-size:clamp(24px,6.5vw,36px);font-weight:900}.okTxt{color:#86efac}.ngTxt{color:#fca5a5}.maybeTxt{color:#fde68a}.ans{font-size:clamp(48px,13vw,78px);font-weight:900;letter-spacing:.08em;line-height:1.05;margin-top:4px}.mean{color:#cbd5e1;font-weight:800;line-height:1.45;margin-top:4px}.cands{color:#bfdbfe;font-weight:900;line-height:1.5;margin-top:7px}
.strokeVisualWrap{margin-top:10px;padding:10px 10px 12px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.05)}
.strokeVisualHead{color:#fde68a;font-weight:900;font-size:clamp(16px,4.2vw,21px);margin-bottom:8px}
.strokeVisualBox{display:flex;justify-content:center;align-items:center;min-height:220px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.18);border-radius:14px;overflow:hidden}
#strokeVisual{width:220px;height:220px;display:flex;justify-content:center;align-items:center}
.strokeVisualNote{margin-top:8px;color:#dbeafe;font-size:clamp(13px,3.4vw,17px);font-weight:800;line-height:1.45}
.strokeCharFallback{font-size:148px;line-height:1;color:#fff;font-weight:900;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif}
.kvgSvg{width:220px;height:220px;display:block}
.kvgOutline{fill:none;stroke:rgba(15,23,42,.16);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.kvgDraw{fill:none;stroke:#0f172a;stroke-width:3.8;stroke-linecap:round;stroke-linejoin:round}
.kvgNum{font:bold 5px sans-serif;fill:#f97316;paint-order:stroke;stroke:#fff;stroke-width:1.8px}
.replayBtn{margin-top:8px;min-height:40px;padding:8px 14px;border:0;border-radius:12px;background:#1d4ed8;color:#fff;font-weight:900}
.bottom{padding:5px 6px calc(5px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(15,23,42,.98),rgba(15,23,42,.84));border-top:1px solid var(--line)}
button,select{border:0;border-radius:12px;padding:8px 9px;font-weight:900;color:#fff;background:#334155;font-size:12px;min-height:36px}select{background:#1e293b;border:1px solid #334155;max-width:138px}
button.primary{background:var(--pri)}button.ok{background:var(--ok)}button.ng{background:var(--ng)}button.warn{background:var(--warn)}button:active{transform:translateY(1px)}
.small{font-size:10px;color:#94a3b8;font-weight:700;line-height:1.15;margin-top:3px}.toggle{display:flex;gap:6px;align-items:center;color:#cbd5e1;font-size:12px;font-weight:800}input[type=checkbox]{width:17px;height:17px}
.bottom .row{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;padding-bottom:2px}.bottom .row>*{flex:0 0 auto}
#candidateList{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden}
@media (orientation:landscape){.top{padding-top:5px}.q{font-size:20px}.sub,.small{display:none}.bottom{padding-top:5px}button,select{min-height:36px;padding:7px 9px}}


.judgeFx{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;opacity:0;z-index:25}
.judgeFx.show{animation:judgeFxFade 1.6s ease forwards}
.judgeFxCore{min-width:min(76vw,420px);max-width:88vw;border-radius:26px;padding:20px 24px;text-align:center;font-weight:900;backdrop-filter:blur(6px);box-shadow:0 18px 44px rgba(0,0,0,.28);transform:scale(.86)}
.judgeFx.show .judgeFxCore{animation:judgeFxPop 1.6s ease forwards}
.judgeFxBadge{font-size:clamp(38px,11vw,72px);line-height:1;margin-bottom:8px}
.judgeFxTitle{font-size:clamp(24px,7vw,42px);line-height:1.15;letter-spacing:.03em}
.judgeFxSub{margin-top:7px;font-size:clamp(13px,3.8vw,18px);line-height:1.4;font-weight:800;opacity:.96}
.judgeFx.ok .judgeFxCore{background:rgba(22,163,74,.20);border:2px solid rgba(134,239,172,.88);color:#f0fdf4}
.judgeFx.ok:before,.judgeFx.ng:before,.judgeFx.maybe:before{content:"";position:absolute;inset:0}
.judgeFx.ok:before{background:radial-gradient(circle at center,rgba(34,197,94,.26),rgba(34,197,94,.10) 34%,rgba(34,197,94,0) 66%)}
.judgeFx.ng .judgeFxCore{background:rgba(220,38,38,.18);border:2px solid rgba(252,165,165,.90);color:#fff1f2}
.judgeFx.ng:before{background:radial-gradient(circle at center,rgba(239,68,68,.24),rgba(239,68,68,.08) 34%,rgba(239,68,68,0) 66%)}
.judgeFx.maybe .judgeFxCore{background:rgba(245,158,11,.18);border:2px solid rgba(253,224,71,.92);color:#fffbeb}
.judgeFx.maybe:before{background:radial-gradient(circle at center,rgba(245,158,11,.24),rgba(245,158,11,.08) 34%,rgba(245,158,11,0) 66%)}
@keyframes judgeFxFade{0%{opacity:0}10%{opacity:1}78%{opacity:1}100%{opacity:0}}
@keyframes judgeFxPop{0%{transform:scale(.80) translateY(22px)}16%{transform:scale(1.05) translateY(0)}74%{transform:scale(1)}100%{transform:scale(.98) translateY(-4px)}}

/* fixed shared id hide */
#sharedIdPanel,#shareIdPanel,#scoreUserPanel,#firebaseUserPanel,.sharedIdPanel,.shareIdPanel,.scoreUserPanel,.firebaseUserPanel,
input[id*="share" i],input[id*="共有" i],button[id*="share" i],button[id*="共有" i],
label[for*="share" i],label[for*="共有" i]{
  display:none!important;
}

<body>
<div class="app">
<header class="top">
  <div class="row"><span class="title">小5 漢字 手書き自動認識</span><span class="badge">小5 50問</span><span class="badge">夏休み漢字</span><span class="score" id="score">0問中 0問正解</span></div>
  <div class="q" id="question">開始を押してね</div>
  <div class="sub" id="status">□穴あけ問題。日本語例文＋熟語から一文字を書いて「自動判定」。</div>
</header>

<main class="canvasWrap">
  <canvas id="kanjiCanvas" data-candidate-list="candidateList"></canvas>
  <div class="guide"></div>
  <div class="ghost" id="ghost"></div>
  <div class="resultBox" id="resultBox">
    <div class="resultMain" id="resultMain">---</div>
    <div class="ans" id="answerText">---</div>
    <div class="mean" id="meaning">---</div>
    <div class="strokeVisualWrap">
      <div class="strokeVisualHead">正しい漢字の画像（KanjiVGカラー筆順・番号色分け）</div>
      <div class="strokeVisualBox"><div id="strokeVisual"></div></div>
      <div class="strokeVisualNote" id="strokeVisualNote">---</div>
      <button class="replayBtn" type="button" onclick="replayStrokeVisual()">もう一回再生</button>
    </div>
    <div class="cands" id="candidates">---</div>
  </div>

  <div class="judgeFx" id="judgeFx" aria-hidden="true">
    <div class="judgeFxCore">
      <div class="judgeFxBadge" id="judgeFxBadge">○</div>
      <div class="judgeFxTitle" id="judgeFxTitle">正解！</div>
      <div class="judgeFxSub" id="judgeFxSub">よく書けました</div>
    </div>
  </div>
  <div id="candidateList"></div>
</main>

<footer class="bottom">
  <div class="row">
    <button class="primary" onclick="start()">開始</button>
    <select id="mode" onchange="start()">
      <option value="all">この50問</option>
      <option value="wrong">間違い復習</option>
    </select>
    <button onclick="undo()">一画戻す</button>
    <button onclick="clearPad()">消す</button>
    <button class="warn" onclick="recognizeNow()">自動判定</button>
    <button class="primary" onclick="next()">次</button>
    <label class="toggle"><input id="ghostToggle" type="checkbox" onchange="drawGhost()">薄い答え</label>
  </div>
  <div class="small">漢検モード：日本語例文（穴あけ）＋熟語（穴あけ）。判定後に正解画像と、判定時と同じ色分けのKanjiVG筆順を表示。</div>
</footer>
</div>
<canvas id="fallbackRef" width="320" height="320" style="display:none"></canvas>
<canvas id="fallbackTmp" width="320" height="320" style="display:none"></canvas>

<script>
const QUESTIONS=[{"char": "因", "word": "原因", "reading": "げんいん", "prompt": "原□と結果。", "meaning": "ものごとのもとになるわけ。"}, {"char": "留", "word": "留学生", "reading": "りゅうがくせい", "prompt": "□学生。", "meaning": "外国へ留学して学ぶ学生。"}, {"char": "現", "word": "表現", "reading": "ひょうげん", "prompt": "英語での表□。", "meaning": "考えや気持ちを表すこと。"}, {"char": "接", "word": "直接", "reading": "ちょくせつ", "prompt": "ちょく□話す。", "meaning": "間に何も入れず、じかに。"}, {"char": "像", "word": "想像", "reading": "そうぞう", "prompt": "場面を想□する。", "meaning": "頭の中に思いうかべること。"}, {"char": "経", "word": "経験", "reading": "けいけん", "prompt": "じぶんの□験。", "meaning": "実際に見たり、したりしたこと。"}, {"char": "象", "word": "印象", "reading": "いんしょう", "prompt": "印□に残る。", "meaning": "心に残る感じ。"}, {"char": "構", "word": "構図", "reading": "こうず", "prompt": "絵の□図。", "meaning": "絵や写真の組み立て。"}, {"char": "絶", "word": "絶対", "reading": "ぜったい", "prompt": "□対に行く。", "meaning": "まちがいなく、必ず。"}, {"char": "運", "word": "運が悪い", "reading": "うんがわるい", "prompt": "□が悪い。", "meaning": "めぐり合わせがよくない。"}, {"char": "丸", "word": "一丸", "reading": "いちがん", "prompt": "一□となる。", "meaning": "みんなが心を一つにすること。"}, {"char": "外", "word": "ほか", "reading": "ほか", "prompt": "思いのほ□か。", "meaning": "予想とは違って。"}, {"char": "許", "word": "許可", "reading": "きょか", "prompt": "□可をもらう。", "meaning": "してもよいとみとめること。"}, {"char": "赤", "word": "赤飯", "reading": "せきはん", "prompt": "□飯をたく。", "meaning": "もち米を赤く炊いたご飯。"}, {"char": "銅", "word": "銅メダル", "reading": "どうメダル", "prompt": "□メダルを取る。", "meaning": "三位のメダル。"}, {"char": "修", "word": "修復", "reading": "しゅうふく", "prompt": "絵画の□復。", "meaning": "こわれたものや傷んだものを直すこと。"}, {"char": "犬", "word": "愛犬家", "reading": "あいけんか", "prompt": "愛□家。", "meaning": "犬が大好きな人。"}, {"char": "情", "word": "心情", "reading": "しんじょう", "prompt": "心□の変化。", "meaning": "心の中の気持ち。"}, {"char": "西", "word": "西部", "reading": "せいぶ", "prompt": "アメリカ□部。", "meaning": "西のほうの地域。"}, {"char": "太", "word": "丸太", "reading": "まるた", "prompt": "丸□を切る。", "meaning": "切り倒した木の幹。"}, {"char": "確", "word": "正確", "reading": "せいかく", "prompt": "正□に答える。", "meaning": "まちがいがなく、たしかであること。"}, {"char": "賞", "word": "賞状", "reading": "しょうじょう", "prompt": "□状をもらう。", "meaning": "表彰のための紙。"}, {"char": "限", "word": "期限", "reading": "きげん", "prompt": "期□を決める。", "meaning": "いつまでというさだめ。"}, {"char": "解", "word": "理解", "reading": "りかい", "prompt": "話を理□する。", "meaning": "意味がわかること。"}, {"char": "祖", "word": "祖父母", "reading": "そふぼ", "prompt": "□父母に会う。", "meaning": "おじいさんとおばあさん。"}, {"char": "容", "word": "内容", "reading": "ないよう", "prompt": "物語の内□。", "meaning": "中身。"}, {"char": "術", "word": "技術", "reading": "ぎじゅつ", "prompt": "新しい技□。", "meaning": "わざやうでまえ。"}, {"char": "適", "word": "適切", "reading": "てきせつ", "prompt": "□切な方法。", "meaning": "ちょうどよくふさわしいこと。"}, {"char": "造", "word": "木造", "reading": "もくぞう", "prompt": "木□の家。", "meaning": "木で作られた建物。"}, {"char": "複", "word": "複数", "reading": "ふくすう", "prompt": "□数のチーム。", "meaning": "二つ以上ある数。"}, {"char": "桜", "word": "桜", "reading": "さくら", "prompt": "□の木。", "meaning": "春に花がさく木。"}, {"char": "破", "word": "読破", "reading": "どくは", "prompt": "本を読□する。", "meaning": "最後まで読み切ること。"}, {"char": "眼", "word": "眼科", "reading": "がんか", "prompt": "□科に通う。", "meaning": "目を診る診療科。"}, {"char": "停", "word": "停車", "reading": "ていしゃ", "prompt": "駅に□車する。", "meaning": "乗り物が止まること。"}, {"char": "際", "word": "国際", "reading": "こくさい", "prompt": "国□会議を開く。", "meaning": "国と国との間に関係すること。"}, {"char": "質", "word": "質問", "reading": "しつもん", "prompt": "□問に答える。", "meaning": "わからないことをたずねること。"}, {"char": "識", "word": "意識", "reading": "いしき", "prompt": "意□を失う。", "meaning": "はっきり気づいている心のはたらき。"}, {"char": "準", "word": "準備", "reading": "じゅんび", "prompt": "運動会の□備。", "meaning": "用意すること。"}, {"char": "貿", "word": "貿易", "reading": "ぼうえき", "prompt": "他国との□易。", "meaning": "国と国との間で品物を売り買いすること。"}, {"char": "喜", "word": "喜ぶ", "reading": "よろこぶ", "prompt": "兄がよろ□ぶ。", "meaning": "うれしく思う。"}, {"char": "破", "word": "破れる", "reading": "やぶれる", "prompt": "紙がや□れる。", "meaning": "さけたり、こわれたりする。"}, {"char": "報", "word": "報告", "reading": "ほうこく", "prompt": "結果を□告する。", "meaning": "知らせること。"}, {"char": "似", "word": "似る", "reading": "にる", "prompt": "親に□る。", "meaning": "よくにかよう。"}, {"char": "直", "word": "直ちに", "reading": "ただちに", "prompt": "□ちに帰る。", "meaning": "すぐに。"}, {"char": "数", "word": "数える", "reading": "かぞえる", "prompt": "人□をかぞえる。", "meaning": "いくつかを調べる。"}, {"char": "造", "word": "造る", "reading": "つくる", "prompt": "大きな船を□る。", "meaning": "材料を使ってつくる。"}, {"char": "厚", "word": "分厚い", "reading": "ぶあつい", "prompt": "ぶ□い雲。", "meaning": "厚みがたっぷりあること。"}, {"char": "属", "word": "所属", "reading": "しょぞく", "prompt": "所□するチーム。", "meaning": "ある集団のなかまになること。"}, {"char": "潔", "word": "清潔", "reading": "せいけつ", "prompt": "清□なハンカチ。", "meaning": "きれいで汚れがないこと。"}, {"char": "確", "word": "確かめる", "reading": "たしかめる", "prompt": "後でたし□める。", "meaning": "まちがいがないかはっきりさせる。"}];
const STROKE_ORDER_COLORS=["#ef4444","#f97316","#f59e0b","#84cc16","#22c55e","#14b8a6","#06b6d4","#3b82f6","#8b5cf6","#ec4899"];
function getStrokeOrderColor(i){return STROKE_ORDER_COLORS[i%STROKE_ORDER_COLORS.length]}
let order=[],idx=0,ok=0,done=0,engineReady=false;
let canvas,canvasWrap,strokes=[],curStroke=null,drawing=false;
let currentStrokeWriter=null;
let wrongIds=JSON.parse(localStorage.getItem('grade5KanjiWrong')||'[]');

function $(id){return document.getElementById(id)}
function showJudgeFx(kind,msg=''){
  const box=$('judgeFx'),badge=$('judgeFxBadge'),title=$('judgeFxTitle'),sub=$('judgeFxSub');
  if(!box||!badge||!title||!sub)return;
  box.className='judgeFx '+kind;
  if(kind==='ok'){badge.textContent='○';title.textContent='正解！';sub.textContent='よく書けました';}
  else if(kind==='maybe'){badge.textContent='△';title.textContent='おしい！';sub.textContent='候補には入っています';}
  else {badge.textContent='×';title.textContent='不正解';sub.textContent='もう一度見直そう';}
  if(msg)sub.textContent += '　' + msg;
  void box.offsetWidth;
  box.classList.add('show');
  clearTimeout(showJudgeFx._tm);
  showJudgeFx._tm=setTimeout(()=>{box.className='judgeFx';},1650);
  try{ if(navigator.vibrate){ navigator.vibrate(kind==='ok'?[40,40,70]:kind==='maybe'?[30,30,30]:[80,40,80]); } }catch(e){}
}

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(){
  let mode=$('mode').value;
  let pool=QUESTIONS.map((q,i)=>({...q,id:i})).filter(q=>isKanjiChar(q.char));
  if(mode==='wrong') pool=pool.filter(q=>wrongIds.includes(q.id));
  if(!pool.length) pool=QUESTIONS.map((q,i)=>({...q,id:i}));
  order=shuffle(pool);idx=0;ok=0;done=0;showQ();
}
function maskedWord(q){return [...q.word].map((c,i)=>i===q.index?'□':c).join('')}
const kanjiHintCache={};
const KANJI_FALLBACK_HINTS={
  '申':{readings:'もうす・シン',meanings:'申し出る。十二支のさる。'},
  '謝':{readings:'あやまる・シャ',meanings:'あやまる。礼を言う。'},
  '認':{readings:'みとめる・ニン',meanings:'みとめる。たしかめる。'},
  '識':{readings:'しる・シキ',meanings:'物事を知る。見分ける。'},
  '愛':{readings:'あい・いとしい',meanings:'大切に思う。かわいがる。'},
  '感':{readings:'カン',meanings:'心に受ける。感じる。'},
  '訪':{readings:'おとずれる・ホウ',meanings:'たずねて行く。'},
  '防':{readings:'ふせぐ・ボウ',meanings:'ふせぐ。守る。'},
  '救':{readings:'すくう・キュウ',meanings:'助ける。'},
  '招':{readings:'まねく・ショウ',meanings:'人をまねく。'},
  '払':{readings:'はらう・フツ',meanings:'はらいのける。支払う。'},
  '抱':{readings:'だく・いだく・ホウ',meanings:'腕でかかえる。心に持つ。'},
  '創':{readings:'つくる・ソウ',meanings:'新しく作り出す。'},
  '解':{readings:'とく・カイ',meanings:'ほどく。分かる。'},

  async function readRemoteBest(){
    const f=await fb();if(!f)return null;
    try{const snap=await f.get(f.ref(f.db,pathFor()));const v=snap.exists()?snap.val():null;return v&&typeof v.best==='number'?v.best:null}catch(e){console.warn(e);return null}
  }
  async function writeRemoteBest(score){
    const f=await fb();if(!f)return;
    try{
      const p=f.ref(f.db,pathFor());
      const snap=await f.get(p);
      const old=snap.exists()?snap.val():null;
      const oldBest=old&&typeof old.best==='number'?old.best:null;
      const payload={...(old||{}),best:oldBest==null||score>oldBest?score:oldBest,subjectName:META.name,subjectId:META.id,updatedAt:f.serverTimestamp(),lastScore:score,scoreUserId:FIXED_USER};
      await f.set(p,payload);
      firebaseState='Firebase DB同期済';
      updateInlineBest();
    }catch(e){console.warn('Firebase write failed',e);firebaseState='Firebase書込失敗・一時端末保存';updateInlineBest()}
  }
  async function removeRemoteBest(){
    const f=await fb();if(!f)return;
    try{await f.remove(f.ref(f.db,pathFor()));firebaseState='Firebase DBリセット済'}catch(e){console.warn(e);firebaseState='Firebaseリセット失敗'}
  }
  function updateInlineBest(){
    const b=readBest();
    document.querySelectorAll('[data-periodic-best],.periodicBestInline').forEach(el=>{el.textContent=b==null?'最高 --点':'最高 '+b+'点'});
  }
  async function syncFromRemote(){
    const rb=await readRemoteBest();
    if(rb!=null){const lb=readBest();if(lb==null||rb>lb)localStorage.setItem(KEY,String(rb))}
    updateInlineBest();
  }
  async function watchRemote(){
    const f=await fb();if(!f)return;
    try{f.onValue(f.ref(f.db,pathFor()),snap=>{const v=snap.val();if(v&&typeof v.best==='number'){const lb=readBest();if(lb==null||v.best>=lb)localStorage.setItem(KEY,String(v.best))}else{localStorage.removeItem(KEY)}updateInlineBest()})}catch(e){console.warn(e)}
  }
  function writeBest(score){
    score=Math.max(0,Math.min(100,Math.round(Number(score)||0)));
    const old=readBest();
    localStorage.setItem(LAST,JSON.stringify({score,at:new Date().toISOString(),name:META.name,scoreUserId:FIXED_USER}));
    if(old==null||score>old){localStorage.setItem(KEY,String(score));writeRemoteBest(score);}
    else {writeRemoteBest(score);}
    updateInlineBest();
  }
  window.__recordPeriodicTestScore=function(score,opts){if(opts&&opts.completed===false)return;writeBest(score)};
  window.__resetPeriodicTestBest=async function(){
    if(confirm(META.name+' の歴代最高得点をリセットする？')){localStorage.removeItem(KEY);localStorage.removeItem(LAST);await removeRemoteBest();updateInlineBest()}
  };
  function ensureInlineInfo(){
    const old=$('periodicTestPanel');if(old)old.remove();
    let host=document.querySelector('[data-periodic-host]')||document.querySelector('header')||document.body.firstElementChild||document.body;
    if(!document.querySelector('.periodicBestInline')){
      const box=document.createElement('div');
      box.className='periodicBestInlineBox';
      box.innerHTML='<span>定期テスト最高：</span><b class="periodicBestInline" data-periodic-best>最高 --点</b><button type="button" class="periodicResetInline">リセット</button>';
      const st=document.createElement('style');
      st.textContent='.periodicBestInlineBox{position:static!important;z-index:auto!important;margin:8px 12px;padding:8px 10px;border:1px solid rgba(148,163,184,.35);border-radius:12px;background:rgba(15,23,42,.06);font-weight:900;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.periodicBestInlineBox button{border:0;border-radius:999px;padding:6px 10px;background:#64748b;color:white;font-weight:900}';
      document.head.appendChild(st);
      if(host===document.body)document.body.insertBefore(box,document.body.firstChild);else host.appendChild(box);
      box.querySelector('button').onclick=window.__resetPeriodicTestBest;
    }
    updateInlineBest();
  }
  function scoreFromOkTotal(ok,total){ok=Number(ok);total=Number(total);if(!total||total<1)return null;return Math.round(ok/total*100)}
  function num(s){const n=Number(String(s||'').replace(/[^0-9.]/g,''));return Number.isFinite(n)?n:null}
  function extractScore(){
    const bodyText=(document.body&&document.body.innerText)||'';
    let best=null;
    const patterns=[/正解\s*([0-9]+)\s*\/\s*([0-9]+)/g,/([0-9]+)問中\s*([0-9]+)問正解/g,/([0-9]+)\s*\/\s*([0-9]+)\s*問/g];
    for(const re of patterns){let m;while((m=re.exec(bodyText))){let a=Number(m[1]),b=Number(m[2]);let sc=null;if(re.source.startsWith('([0-9]+)問中'))sc=scoreFromOkTotal(b,a);else sc=scoreFromOkTotal(a,b);if(sc!=null)best=sc}}
    let m=bodyText.match(/(?:得点|スコア|点数)[^0-9]{0,8}([0-9]{1,3})\s*点/);if(m)best=Math.max(0,Math.min(100,Number(m[1])));
    m=bodyText.match(/([0-9]{1,3})\s*点相当/);if(m)best=Math.max(0,Math.min(100,Number(m[1])));
    const scoreEl=$('score');if(scoreEl){const n=num(scoreEl.textContent);if(n!=null&&n>=0&&n<=100)best=Math.round(n)}
    return best;
  }
  function completionSignal(){
    const t=(document.body&&document.body.innerText)||'';
    if(/終了|完了|最後|1周終わり|テスト終了|全問終了|結果/.test(t))return true;
    const qno=$('qno')?.textContent||'';const m=qno.match(/([0-9]+)\s*\/\s*([0-9]+)/);
    if(m&&Number(m[1])>=Number(m[2])&&Number(m[2])>0&&/正解\s*[0-9]+\s*\//.test(t))return true;
    const m2=t.match(/([0-9]+)問中\s*([0-9]+)問正解/);
    if(m2&&Number(m2[1])>0)return true;
    return false;
  }
  let recordedAt=0,lastScoreKey='';
  function maybeRecord(){
    if(Date.now()-recordedAt<1500)return;
    if(!completionSignal())return;
    const s=extractScore();if(s==null)return;
    const key=String(s)+'|'+((document.body&&document.body.innerText)||'').slice(0,80);
    if(key===lastScoreKey)return;
    lastScoreKey=key;recordedAt=Date.now();writeBest(s);
  }
  const oldAlert=window.alert;
  window.alert=function(msg){try{if(String(msg).match(/1周終わり|終了|完了|結果/))setTimeout(maybeRecord,50)}catch(e){}return oldAlert.apply(this,arguments)};
  window.addEventListener('storage',()=>syncFromRemote());
  window.addEventListener('load',()=>{ensureInlineInfo();syncFromRemote();watchRemote();setInterval(maybeRecord,1200);const mo=new MutationObserver(()=>maybeRecord());mo.observe(document.body,{childList:true,subtree:true,characterData:true})});
})();
</script>
</body></html>
