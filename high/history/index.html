<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>高校 歴史｜4択テストゲーム</title>
<style>
:root{--bg:#fff7ed;--card:#fff;--ink:#1f2937;--muted:#64748b;--line:#fed7aa;--pri:#b45309;--pri2:#ef4444;--ok:#16a34a;--ng:#dc2626;--shadow:0 18px 45px rgba(120,53,15,.16);--r:24px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#fff7ed,#fefce8 45%,#eef6ff);color:var(--ink)}
.wrap{max-width:980px;margin:0 auto;padding:18px 14px 80px}header{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:28px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
h1{margin:0 0 8px;font-size:clamp(26px,5vw,46px);line-height:1.05}.lead{margin:0;color:var(--muted);font-weight:700;line-height:1.7}.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.badge{background:#ffedd5;border:1px solid #fed7aa;border-radius:999px;padding:8px 11px;font-weight:900;color:#7c2d12}
.panel{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:14px;margin:12px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,a.btn{border:0;border-radius:16px;padding:12px 16px;font-weight:900;font-size:15px;background:var(--pri);color:#fff;box-shadow:0 8px 18px rgba(180,83,9,.22);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}button.secondary,a.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}button.good{background:var(--ok)}button.warn{background:#f97316}button:disabled{opacity:.55;cursor:not-allowed}select{padding:12px;border-radius:14px;border:1px solid var(--line);font-weight:800;background:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fff7ed;border:1px solid #fed7aa;border-radius:18px;padding:12px}.stat b{display:block;font-size:24px}.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.tag{display:inline-block;background:#ffedd5;color:#9a3412;border-radius:999px;padding:7px 10px;font-weight:900}.qno{font-weight:900;color:var(--muted)}.question{font-size:clamp(20px,4vw,30px);font-weight:900;line-height:1.45;margin:14px 0}.choices{display:grid;gap:10px}.choice{text-align:left;background:#fff;border:2px solid #fed7aa;color:var(--ink);box-shadow:none;border-radius:18px;padding:14px 16px;font-size:18px;justify-content:flex-start}.choice.correct{border-color:#16a34a;background:#dcfce7}.choice.wrong{border-color:#dc2626;background:#fee2e2}.result{font-weight:900;font-size:18px;line-height:1.6}.result.ok{color:#15803d}.result.ng{color:#b91c1c}.explain{color:#475569;font-weight:700;line-height:1.7;margin-top:8px}.hidden{display:none!important}.memo{width:100%;min-height:80px;border-radius:16px;border:1px solid var(--line);padding:12px;font-weight:700}.foot{color:#64748b;font-size:13px;line-height:1.7}.modal{position:fixed;inset:0;background:rgba(15,23,42,.62);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.open{display:flex}.modalCard{width:min(920px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:28px;padding:18px;box-shadow:0 24px 80px rgba(0,0,0,.25)}.modalTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}.modalTop h2{margin:0;font-size:24px}.refsvg{width:100%;height:auto;border:1px solid #e2e8f0;border-radius:20px;background:#fff}.caption{font-weight:800;color:#475569;line-height:1.6}.pillbox{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#f8fafc;border:1px solid #e2e8f0;border-radius:999px;padding:6px 9px;font-weight:800;color:#475569}@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.choice{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
<header>
 <h1>高校 歴史 4択テスト</h1>
 <p class="lead">添付画像の範囲を中心に、イギリス革命・アメリカ独立革命・フランス革命・ナポレオン・ウィーン体制・1848年革命・ドイツ／イタリア統一までを演習。図問題は参照ポップアップつき。</p>
 <div class="badges"><span class="badge">全100問</span><span class="badge">50問100点モード</span><span class="badge">図参照つき</span><span class="badge">弱点復習</span></div>
</header>

<section class="panel">
 <div class="stats">
  <div class="stat"><span>問題数</span><b id="total">0</b></div>
  <div class="stat"><span>正解</span><b id="ok">0</b></div>
  <div class="stat"><span>得点</span><b id="score">0</b></div>
  <div class="stat"><span>正答率</span><b id="rate">0%</b></div>
 </div>
 <div class="row" style="margin-top:12px">
  <select id="mode">
   <option value="all">全問シャッフル</option>
   <option value="exam">本番 50問100点</option>
   <option value="wrong">間違いだけ復習</option>
  </select>
  <select id="cat"><option value="">全カテゴリ</option></select>
  <button onclick="start()">開始／やり直し</button>
  <button class="secondary" onclick="speak(current?.prompt||'')">問題読み上げ</button>
  <a class="btn secondary" href="../../index.html">TOPへ</a>
 </div>
</section>

<section class="panel" id="quiz">
 <div class="qhead"><span class="tag" id="qcat">カテゴリ</span><span class="qno" id="qno">0 / 0</span></div>
 <div id="figBtnArea" class="row"></div>
 <div class="question" id="prompt">開始を押してね。</div>
 <div class="choices" id="choices"></div>
 <div id="res" class="result"></div>
 <div id="exp" class="explain"></div>
 <div class="row" style="margin-top:14px">
  <button id="nextBtn" class="good hidden" onclick="next()">次へ</button>
  <button class="secondary" onclick="showAnswer()">答えを見る</button>
 </div>
</section>

<section class="panel">
 <h2>弱点メモ</h2>
 <textarea id="memo" class="memo" placeholder="まだなし"></textarea>
 <div class="row" style="margin-top:10px"><button class="secondary" onclick="saveMemo()">保存</button><button class="secondary" onclick="clearProgress()">成績リセット</button></div>
</section>

<p class="foot">※図は学習用に作った簡略図。正確な国境図ではなく、歴史事項の位置関係・構造理解用。</p>
</div>

<div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()">
 <div class="modalCard">
  <div class="modalTop"><h2 id="modalTitle">参照</h2><button class="secondary" onclick="closeModal()">閉じる</button></div>
  <div id="modalBody"></div>
 </div>
</div>

<script>

let order=[],idx=0,ok=0,answered=false,current=null,wrongIds=JSON.parse(localStorage.getItem('highHistoryWrong')||'[]');
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function init(){
 $('total').textContent=QUESTIONS.length;
 const cats=[...new Set(QUESTIONS.map(q=>q.cat))];
 $('cat').innerHTML='<option value="">全カテゴリ</option>'+cats.map(c=>`<option>${c}</option>`).join('');
 $('memo').value=localStorage.getItem('highHistoryMemo')||'';
 start();
}
function start(){
 const mode=$('mode').value, cat=$('cat').value;
 let pool=QUESTIONS.map((q,i)=>({...q,id:i}));
 if(cat) pool=pool.filter(q=>q.cat===cat);
 if(mode==='wrong') pool=pool.filter(q=>wrongIds.includes(q.id));
 pool=shuffle(pool);
 if(mode==='exam') pool=pool.slice(0,50);
 if(pool.length===0){$('prompt').textContent='対象問題がない。全問モードでやり直して。';$('choices').innerHTML='';return;}
 order=pool; idx=0; ok=0; answered=false; render();
}
function render(){
 current=order[idx]; answered=false;
 $('qcat').textContent=current.cat;
 $('qno').textContent=`${idx+1} / ${order.length}`;
 $('prompt').textContent=current.prompt;
 $('res').textContent=''; $('res').className='result';
 $('exp').textContent='';
 $('nextBtn').classList.add('hidden');
 $('figBtnArea').innerHTML=current.fig?`<button class="secondary" onclick="openFigure('${current.fig}')">📖 図を見る</button>`:'';
 const choices=shuffle(current.choices);
 $('choices').innerHTML=choices.map(c=>`<button class="choice" onclick="choose(this, '${escapeJs(c)}')">${c}</button>`).join('');
 updateStats();
}
function escapeJs(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ')}
function choose(btn,val){
 if(answered)return; answered=true;
 const buttons=[...document.querySelectorAll('.choice')];
 buttons.forEach(b=>{if(b.textContent===current.answer)b.classList.add('correct');});
 if(val===current.answer){ok++; $('res').textContent='正解！'; $('res').classList.add('ok'); wrongIds=wrongIds.filter(id=>id!==current.id);}
 else{btn.classList.add('wrong'); $('res').textContent=`不正解。正解は「${current.answer}」。`; $('res').classList.add('ng'); if(!wrongIds.includes(current.id))wrongIds.push(current.id);}
 localStorage.setItem('highHistoryWrong',JSON.stringify(wrongIds));
 $('exp').textContent=current.exp||'';
 $('nextBtn').classList.remove('hidden');
 updateStats();
}
function showAnswer(){
 if(answered)return;
 const buttons=[...document.querySelectorAll('.choice')];
 buttons.forEach(b=>{if(b.textContent===current.answer)b.classList.add('correct');});
 $('res').textContent=`正解は「${current.answer}」。`;
 $('res').className='result ok';
 $('exp').textContent=current.exp||'';
 answered=true; $('nextBtn').classList.remove('hidden');
}
function next(){
 idx++;
 if(idx>=order.length){
   $('prompt').textContent=`終了！ 得点は ${Math.round(ok/order.length*100)}点相当。`;
   $('choices').innerHTML=''; $('figBtnArea').innerHTML='';
   $('qno').textContent=`${order.length} / ${order.length}`;
   $('res').textContent=`正解 ${ok} / ${order.length}`;
   $('exp').textContent='間違いだけ復習モードで弱点をつぶそう。';
   $('nextBtn').classList.add('hidden'); updateStats(); return;
 }
 render();
}
function updateStats(){
 $('ok').textContent=ok;
 const done=answered?idx+1:idx;
 const denom=order.length||1;
 const score=order.length?Math.round(ok/denom*100):0;
 $('score').textContent=score;
 $('rate').textContent=done?Math.round(ok/done*100)+'%':'0%';
}
function openFigure(key){
 const f=FIGURES[key]; if(!f)return;
 $('modalTitle').textContent=f.title; $('modalBody').innerHTML=f.html; $('modal').classList.add('open');
}
function closeModal(){$('modal').classList.remove('open')}
function speak(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';speechSynthesis.speak(u)}catch(e){}}
function saveMemo(){localStorage.setItem('highHistoryMemo',$('memo').value);alert('保存した')}
function clearProgress(){localStorage.removeItem('highHistoryWrong');wrongIds=[];alert('リセットした')}
init();
</script>
