, "choices": ["There are some apples on the table.", "There is some apples on the table.", "There are any apples on the table.", "There are some apple on the table."], "answer": 0, "explain": "", "ref": null, "speak": "「机の上にりんごがいくつかあります。」に合う英文は？"}, {"cat": "良問", "prompt": "「近くに店はありますか。」に合う英文は？", "choices": ["Are there any shops near here?", "Is there any shops near here?", "Are there some shop near here?", "Do there are shops near here?"], "answer": 0, "explain": "", "ref": null, "speak": "「近くに店はありますか。」に合う英文は？"}, {"cat": "良問", "prompt": "「私にあなたのノートを見せてください。」SVOOの英文は？", "choices": ["Please show me your notebook.", "Please show your notebook me.", "Please show to me your notebook.", "Please me show your notebook."], "answer": 0, "explain": "", "ref": null, "speak": "「私にあなたのノートを見せてください。」SVOOの英文は？"}, {"cat": "良問", "prompt": "「その知らせは私を悲しくさせた。」に合う英文は？", "choices": ["The news made me sad.", "The news made me sadly.", "The news gave me sad.", "The news kept me sadness."], "answer": 0, "explain": "SVOCで me = sad。", "ref": null, "speak": "「その知らせは私を悲しくさせた。」に合う英文は？"}, {"cat": "総合", "prompt": "I have lived in Kyoto (　) 2020. に入る語は？", "choices": ["since", "for", "during", "from"], "answer": 0, "explain": "開始時点には since。", "ref": null, "speak": "I have lived in Kyoto (　) 2020. に入る語は？"}, {"cat": "総合", "prompt": "I have lived in Kyoto (　) three years. に入る語は？", "choices": ["for", "since", "from", "during"], "answer": 0, "explain": "期間には for。", "ref": null, "speak": "I have lived in Kyoto (　) three years. に入る語は？"}, {"cat": "総合", "prompt": "「私は3年間英語を勉強しています。」に合う英文は？", "choices": ["I have studied English for three years.", "I studied English since three years.", "I am studying English since three years.", "I have study English for three years."], "answer": 0, "explain": "", "ref": null, "speak": "「私は3年間英語を勉強しています。」に合う英文は？"}, {"cat": "総合", "prompt": "「私は一度も馬に乗ったことがありません。」に合う英文は？", "choices": ["I have never ridden a horse.", "I have never rode a horse.", "I never have ride a horse.", "I did never ridden a horse."], "answer": 0, "explain": "", "ref": null, "speak": "「私は一度も馬に乗ったことがありません。」に合う英文は？"}, {"cat": "総合", "prompt": "「彼らはその部屋をきれいに保った。」に合う英文は？", "choices": ["They kept the room clean.", "They kept clean the room is.", "They made the room cleanly.", "They gave the room clean."], "answer": 0, "explain": "", "ref": null, "speak": "「彼らはその部屋をきれいに保った。」に合う英文は？"}, {"cat": "総合", "prompt": "「彼女は私たちにすてきな話をしてくれた。」に合う英文は？", "choices": ["She told us a nice story.", "She told to us a nice story.", "She told a nice story us.", "She said us a nice story."], "answer": 0, "explain": "", "ref": null, "speak": "「彼女は私たちにすてきな話をしてくれた。」に合う英文は？"}];
const REFS={"intro1": "Lesson 1「はじめに①」\nA: You dropped your key.\nB: Thank you.\nA: I bought this book yesterday.\nB: Did you meet Ms. Carter?\nA: We sell clocks and watches here.\n\nNotes: 「かぎを落としましたよ」は You dropped your key. 「今日は宿題がありません」は I don't have homework today. 「とても暑い」は It is very hot.", "intro2": "Lesson 2「はじめに②」\nI am coffee. とは言わず、飲み物を注文するときは I'll have coffee.\n「お願いがある」は Will you do me a favor? / Could you please ...?\n「〜してくれますか」は Will you ...? / Can you ...? / Could you ...?\n「〜するつもり」は be going to / will.", "school1": "Lesson 1 School Life Dialog\nA: Would you like to join us for lunch?\nB: Sure.\nA: Let's go to the cafeteria and line up.\nB: Neither can I. Shall we ask Ms. Mori?\nA: Why don't we go to the library and work on our history homework?\nB: Oh, maybe tomorrow then.\nA: I'm still thinking about it. How about another ten minutes?\nB: Fine.", "school2": "School Life Dialog / Further Activities\nPaul wants to do a cultural club activity at school with Yoko.\nP: Would you like to join a sports team?\nY: I'd like to, but I'm not very good at sports.\nP: Are you interested in cultural things?\nY: Yes, you could say that.\nP: Aren't you surprised to hear that?\nY: Well, maybe. I could join the dance club.\nThey are both interested in cultural activities.", "creatures1": "Lesson 2 Light from Creatures Part 1\nCan you see these small blue lights in this picture of Toyama Bay?\nThese lights are much loved by the local people. They are a symbol of spring.\nWhere do the lights come from? They are from firefly squid, hotaruika in Japanese.\nHow do the squid give off light? They have special organs in their bodies.\nThe organs flash light in various patterns.\nDo other creatures glow like these squid? Yes. Fireflies, anglerfish, and crystal jellyfish also produce light.\nHow do they give off light? We do not understand it clearly.", "creatures2": "Lesson 2 Light from Creatures Part 2\nFirefly squid flash light when they distract predators.\nFireflies fly near rivers in the Japanese countryside on early summer nights.\nThey have appeared in Japanese poems and songs for centuries.\nThey turn their lights on and off when they look for mates.\nAnglerfish live in the deep, dark sea. They flash lights when they look for food.\nThe lights attract small fish. In these ways, light is used for different purposes.", "creatures3": "Lesson 2 Light from Creatures Part 3\nLight from creatures is useful in the study of medicine.\nThis light is used for cancer detection.\nFor successful treatment, early cancer detection is important.\nScientists discovered a luminous protein in crystal jellyfish.\nThey have been using it in the development of methods for cancer detection.\nWhen it is put into a human body, cancer cells glow.\nThey are found with a special camera.\nThe study of light from creatures will certainly improve and brighten our lives.", "grammar04": "Grammar 04 文型②\nS+V+O: Many people wash their cars on Sundays.\nS+V+O+O: The boy gave his mother some flowers.\nS+V+O+C: The flowers made her happy.\n第5文型では O と C に「O=C」の関係がある。\nYou must keep your hands clean.", "grammar05": "Grammar 05 時制①\nTom plays tennis every day. 現在形。\nTom is playing tennis now. 現在進行形。\nFred watched a movie on TV last night. 過去形。\nFred was watching TV when the phone rang. 過去進行形。\nMeg will be in Paris tomorrow. 未来表現。", "grammar06": "Grammar 06 時制② 現在完了形\n過去形: They moved to Australia. 今どこにいるかは不明。\n現在完了形: They have moved to Australia. 現在への影響を含む。\n完了・結果: have + 過去分詞「〜してしまった」\n経験: have never seen「見たことがない」\n継続: have been in Sydney for a week「1週間ずっといる」"};
let pool=[],idx=0,current=null,answered=false,stats=JSON.parse(localStorage.getItem('ron1Stats')||'{"ok":0,"ng":0,"wrong":[]}');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function save(){localStorage.setItem('ron1Stats',JSON.stringify(stats));renderStats()}
function init(){const cats=[...new Set(QUESTIONS.map(q=>q.cat))];const sel=document.getElementById('filter');cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o)});renderStats();start('mock')}
function start(mode){document.getElementById('mode').textContent=mode==='mock'?'50問100点':mode==='wrong'?'復習':'練習';let arr=[...QUESTIONS];if(mode==='filter'){const f=document.getElementById('filter').value;if(f!=='all')arr=arr.filter(q=>q.cat===f)}if(mode==='wrong'){arr=stats.wrong.map(i=>QUESTIONS[i]).filter(Boolean);if(!arr.length) arr=[...QUESTIONS]}shuffle(arr);if(mode==='mock')arr=arr.slice(0,50);pool=arr;idx=0;stats.sessionOk=0;stats.sessionNg=0;nextQ(true)}
function nextQ(first=false){if(!pool.length)return;answered=false;document.getElementById('nextBtn').disabled=true;document.getElementById('result').className='result';current=pool[idx%pool.length];document.getElementById('cat').textContent=current.cat;document.getElementById('count').textContent=(idx+1)+'/'+pool.length;document.getElementById('remain').textContent=Math.max(pool.length-idx-1,0);document.getElementById('prompt').textContent=current.prompt;const refArea=document.getElementById('refArea');refArea.innerHTML=current.ref?`<button onclick="openRef('${current.ref}')">📖 本文参照</button>`:'';const order=shuffle(current.choices.map((c,i)=>({c,i})));const ch=document.getElementById('choices');ch.innerHTML='';order.forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o.c;b.onclick=()=>answer(o.i,b);ch.appendChild(b)});idx++;renderStats()}
function answer(i,btn){if(answered)return;answered=true;const good=i===current.answer;[...document.querySelectorAll('.choice')].forEach(b=>{const txt=b.textContent;const real=current.choices.indexOf(txt);if(real===current.answer)b.classList.add('correct')});if(!good)btn.classList.add('wrong');const realIndex=QUESTIONS.indexOf(current);if(good)stats.ok++;else{stats.ng++; if(!stats.wrong.includes(realIndex))stats.wrong.push(realIndex)}if(good && stats.wrong.includes(realIndex))stats.wrong=stats.wrong.filter(x=>x!==realIndex);showResult(good);save();document.getElementById('nextBtn').disabled=false;speak(current.choices[current.answer])}
function showResult(good){const r=document.getElementById('result');r.className='result show';r.innerHTML=`${good?'<b class="ok">正解！</b>':'<b class="bad">ミス！</b>'}<br>正解：<b>${current.choices[current.answer]}</b><br>${current.explain||''}`;}
function showAnswer(){if(!current)return;answered=true;[...document.querySelectorAll('.choice')].forEach(b=>{if(b.textContent===current.choices[current.answer])b.classList.add('correct')});showResult(false);document.getElementById('nextBtn').disabled=false}
function renderStats(){document.getElementById('ok').textContent=stats.ok||0;document.getElementById('ng').textContent=stats.ng||0;const total=(stats.ok||0)+(stats.ng||0);document.getElementById('rate').textContent=total?Math.round(stats.ok/total*100)+'%':'0%';const wl=document.getElementById('wrongList');wl.innerHTML='<h2>ミス一覧</h2>'+((stats.wrong||[]).slice(-20).reverse().map(i=>`<div class="mini">${QUESTIONS[i]?.cat||''}：${QUESTIONS[i]?.prompt||''}</div>`).join('')||'<div class="mini">まだミスなし</div>')}
function resetStats(){stats={ok:0,ng:0,wrong:[]};save()}
function speak(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=/[A-Za-z]/.test(text)?'en-US':'ja-JP';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function speakCurrent(){if(current)speak(current.speak||current.prompt)}
function openRef(k){document.getElementById('modalText').textContent=REFS[k]||'';document.getElementById('modal').classList.add('show')}
function closeRef(){document.getElementById('modal').classList.remove('show')}
function speakRef(){speak(document.getElementById('modalText').textContent)}
init();
</script></body></html>
