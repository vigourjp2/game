const STORY="春の夕べ、姫は月をながむ。昔の約束をしのぶ。乳母はただ仏にねんず。文を都へやる。友より返り文をおこす。姫はいそぎいらふ。若君は市をありく。ついでに姫の宿をとぶらふ。川をわたる舟に乗る。小童をぐす。門の前にゐる。夕暮れにいぬ。道で姫にあふ。その姿をみる。都のことをならふ。話は尽きず、心はあく。花は風にうつろふ。鐘の音におどろく。これは夢かとおぼゆ。若君はそっとものす。姫を大切にかしづく。皆その才をめづ。梅の香がにほふ。庭で笛をあそぶ。童らは門でののしる。乳母は宴をまうく。姫は若君をたのむ。ところが雨で道をわづらふ。病の父は少しおこたる。姫は旅の遅れをうれふ。使者は山道でまどふ。若君は一人わぶ。灯は風にうす。僧は寺でおこなふ。翁は訳をあきらむ。その夜の月はをかし。笛の音もおもしろし。姫は都の話がゆかし。小猫はうつくし。その声はいとかなしかり。姫の姿はうるはし。心ばえもよし。かかる縁はありがたし。この暮らしこそあらまほし。再会はめでたし。若君の礼ははづかし。姫の文はやさし。乳母の早合点はかたはらいたし。帝の使ひはかしこし。知らせはいみじ。夜の雷はゆゆし。門の影はあやし。突然の客はあさまし。雨の庭はすさまじ。友なき夜はさうざうし。姫の家はやむごとなし。古き蔵はむつかし。今会ふはびんなし。別れはうし。約束を忘るる人はつらし。";

let order=[],idx=0,ok=0,answered=false,current=null,wrongIds=JSON.parse(localStorage.getItem('highClassicsWrong')||'[]');const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function init(){$('total').textContent=QUESTIONS.length;const cats=[...new Set(QUESTIONS.map(q=>q.cat))];$('cat').innerHTML='<option value="">全カテゴリ</option>'+cats.map(c=>`<option>${c}</option>`).join('');$('memo').value=localStorage.getItem('highClassicsMemo')||'';start()}function start(){const mode=$('mode').value,cat=$('cat').value;let pool=QUESTIONS.map((q,i)=>({...q,id:i}));if(cat)pool=pool.filter(q=>q.cat===cat);if(mode==='wrong')pool=pool.filter(q=>wrongIds.includes(q.id));pool=shuffle(pool);if(mode==='exam')pool=pool.slice(0,50);if(pool.length===0){$('prompt').textContent='対象問題がない。全問モードでやり直して。';$('choices').innerHTML='';return}order=pool;idx=0;ok=0;answered=false;render()}function render(){current=order[idx];answered=false;$('qcat').textContent=current.cat;$('qno').textContent=`${idx+1} / ${order.length}`;$('prompt').textContent=current.prompt;$('res').textContent='';$('res').className='result';$('exp').textContent='';$('nextBtn').classList.add('hidden');const choices=shuffle(current.choices);$('choices').innerHTML=choices.map(c=>`<button class="choice" onclick="choose(this)">${c}</button>`).join('');updateStats()}function choose(btn){const val=btn.textContent;if(answered)return;answered=true;[...document.querySelectorAll('.choice')].forEach(b=>{if(b.textContent===current.answer)b.classList.add('correct')});if(val===current.answer){ok++;$('res').textContent='正解！';$('res').classList.add('ok');wrongIds=wrongIds.filter(id=>id!==current.id)}else{btn.classList.add('wrong');$('res').textContent=`不正解。正解は「${current.answer}」。`;$('res').classList.add('ng');if(!wrongIds.includes(current.id))wrongIds.push(current.id)}localStorage.setItem('highClassicsWrong',JSON.stringify(wrongIds));$('exp').textContent=current.exp||'';$('nextBtn').classList.remove('hidden');updateStats()}function showAnswer(){if(answered)return;[...document.querySelectorAll('.choice')].forEach(b=>{if(b.textContent===current.answer)b.classList.add('correct')});$('res').textContent=`正解は「${current.answer}」。`;$('res').className='result ok';$('exp').textContent=current.exp||'';answered=true;$('nextBtn').classList.remove('hidden')}function next(){idx++;if(idx>=order.length){$('prompt').textContent=`終了！ 得点は ${Math.round(ok/order.length*100)}点相当。`;$('choices').innerHTML='';$('qno').textContent=`${order.length} / ${order.length}`;$('res').textContent=`正解 ${ok} / ${order.length}`;$('res').className='result ok';$('exp').textContent='間違いだけ復習モードで弱点をつぶそう。';$('nextBtn').classList.add('hidden');updateStats();return}render()}function updateStats(){$('ok').textContent=ok;const done=answered?idx+1:idx;const denom=order.length||1;$('score').textContent=order.length?Math.round(ok/denom*100):0;$('rate').textContent=done?Math.round(ok/done*100)+'%':'0%'}function openStory(){$('modalTitle').textContent='古文風ストーリー・日本語訳';$('modalBody').innerHTML=`<div class="row"><button onclick="speak(STORY,'ja-JP',0.82)">🔊 古文風本文</button><button class="secondary" onclick="speak(TRANS,'ja-JP',1.0)">🔊 日本語訳</button></div><h3>古文風本文</h3><div class="storyBox">${STORY_HTML}</div><h3>日本語訳</h3><div class="trans">${TRANS}</div>`;$('modal').classList.add('open')}function openTerms(){const html=TERMS.map(t=>`<div class="term">${t}<small>${MEANING[t]}</small></div>`).join('');$('modalTitle').textContent='古文単語一覧';$('modalBody').innerHTML=`<div class="terms">${html}</div>`;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}function speak(text,lang='ja-JP',rate=1){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate;u.pitch=.92;speechSynthesis.speak(u)}catch(e){alert('このブラウザでは音声再生が使えないかも。')}}function speakCurrent(){if(!current)return;speak(current.prompt)}function saveMemo(){localStorage.setItem('highClassicsMemo',$('memo').value);alert('保存した')}function clearProgress(){localStorage.removeItem('highClassicsWrong');wrongIds=[];alert('リセットした')}init();
</script></body></html>
