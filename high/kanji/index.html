<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>高校 漢字｜手書き自動認識テスト</title>
<style>
:root{--bg:#0f172a;--ink:#f8fafc;--muted:#cbd5e1;--line:#334155;--pri:#2563eb;--ok:#16a34a;--ng:#dc2626;--warn:#f97316}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
.top{padding:8px 10px calc(8px + env(safe-area-inset-top));background:linear-gradient(180deg,rgba(15,23,42,.98),rgba(15,23,42,.82));border-bottom:1px solid var(--line)}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.title{font-weight:900;font-size:14px;color:#93c5fd}.badge{border:1px solid var(--line);background:#1e293b;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:900;color:#dbeafe}
.q{font-weight:900;font-size:clamp(18px,4.8vw,30px);line-height:1.28;margin-top:6px}.sub{font-size:12px;color:var(--muted);font-weight:800;margin-top:4px;line-height:1.35}.score{margin-left:auto;color:#cbd5e1;font-weight:900;font-size:13px}
.canvasWrap{position:relative;min-height:0;background:#fff;touch-action:none}
#kanjiCanvas{display:block;width:100%;height:100%;background:#fff;touch-action:none;cursor:crosshair}
.guide{pointer-events:none;position:absolute;inset:0;background:
linear-gradient(to right,transparent calc(50% - .5px),rgba(148,163,184,.45) calc(50% - .5px),rgba(148,163,184,.45) calc(50% + .5px),transparent calc(50% + .5px)),
linear-gradient(to bottom,transparent calc(50% - .5px),rgba(148,163,184,.45) calc(50% - .5px),rgba(148,163,184,.45) calc(50% + .5px),transparent calc(50% + .5px))}
.guide:before{content:"";position:absolute;inset:10px;border:2px dashed rgba(148,163,184,.45);border-radius:18px}
.ghost{pointer-events:none;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(62vw,62vh);font-weight:900;color:rgba(15,23,42,.055);line-height:1}
.resultBox{display:none;position:absolute;left:10px;right:10px;bottom:10px;max-height:78vh;overflow:auto;background:rgba(15,23,42,.94);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:12px;box-shadow:0 14px 40px rgba(0,0,0,.28)}
.resultBox.open{display:block}.resultMain{font-size:clamp(24px,6.5vw,36px);font-weight:900}.okTxt{color:#86efac}.ngTxt{color:#fca5a5}.maybeTxt{color:#fde68a}.ans{font-size:clamp(48px,13vw,78px);font-weight:900;letter-spacing:.08em;line-height:1.05;margin-top:4px}.mean{color:#cbd5e1;font-weight:800;line-height:1.45;margin-top:4px}.cands{color:#bfdbfe;font-weight:900;line-height:1.5;margin-top:7px}
.strokeVisualWrap{margin-top:10px;padding:10px 10px 12px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.05)}
.strokeVisualHead{color:#fde68a;font-weight:900;font-size:clamp(16px,4.2vw,21px);margin-bottom:8px}
.strokeVisualBox{display:flex;justify-content:center;align-items:center;min-height:220px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.18);border-radius:14px;overflow:hidden}
#strokeVisual{width:220px;height:220px;display:flex;justify-content:center;align-items:center}
.strokeVisualNote{margin-top:8px;color:#dbeafe;font-size:clamp(13px,3.4vw,17px);font-weight:800;line-height:1.45}
.strokeCharFallback{font-size:148px;line-height:1;color:#fff;font-weight:900;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif}
.replayBtn{margin-top:8px;min-height:40px;padding:8px 14px;border:0;border-radius:12px;background:#1d4ed8;color:#fff;font-weight:900}
.bottom{padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(15,23,42,.98),rgba(15,23,42,.84));border-top:1px solid var(--line)}
button,select{border:0;border-radius:13px;padding:10px 10px;font-weight:900;color:#fff;background:#334155;font-size:13px;min-height:42px}select{background:#1e293b;border:1px solid #334155;max-width:150px}
button.primary{background:var(--pri)}button.ok{background:var(--ok)}button.ng{background:var(--ng)}button.warn{background:var(--warn)}button:active{transform:translateY(1px)}
.small{font-size:11px;color:#94a3b8;font-weight:700;line-height:1.25;margin-top:4px}.toggle{display:flex;gap:6px;align-items:center;color:#cbd5e1;font-size:12px;font-weight:800}input[type=checkbox]{width:18px;height:18px}
#candidateList{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden}
@media (orientation:landscape){.top{padding-top:5px}.q{font-size:20px}.sub,.small{display:none}.bottom{padding-top:5px}button,select{min-height:36px;padding:7px 9px}}

/* fixed shared id hide */
#sharedIdPanel,#shareIdPanel,#scoreUserPanel,#firebaseUserPanel,.sharedIdPanel,.shareIdPanel,.scoreUserPanel,.firebaseUserPanel,
input[id*="share" i],input[id*="共有" i],button[id*="share" i],button[id*="共有" i],
label[for*="share" i],label[for*="共有" i]{
  display:none!important;
}

<body>
<div class="app">
<header class="top">
  <div class="row"><span class="title">高校 漢字 手書き自動認識</span><span class="badge">漢検5級1026字</span><span class="badge">添付画像語</span><span class="score" id="score">0問中 0問正解</span></div>
  <div class="q" id="question">開始を押してね</div>
  <div class="sub" id="status">GitHub PagesなどHTTPS環境推奨。画面いっぱいに一文字を書いて「自動判定」。</div>
</header>

<main class="canvasWrap">
  <canvas id="kanjiCanvas" data-candidate-list="candidateList"></canvas>
  <div class="guide"></div>
  <div class="ghost" id="ghost"></div>
  <div class="resultBox" id="resultBox">
    <div class="resultMain" id="resultMain">---</div>
    <div class="ans" id="answerText">---</div>
    <div class="mean" id="meaning">---</div>
    <div class="strokeVisualWrap">
      <div class="strokeVisualHead">正しい漢字の画像（書き順つき）</div>
      <div class="strokeVisualBox"><div id="strokeVisual"></div></div>
      <div class="strokeVisualNote" id="strokeVisualNote">---</div>
      <button class="replayBtn" type="button" onclick="replayStrokeVisual()">もう一回再生</button>
    </div>
    <div class="cands" id="candidates">---</div>
  </div>
  <div id="candidateList"></div>
</main>

<footer class="bottom">
  <div class="row">
    <button class="primary" onclick="start()">開始</button>
    <select id="mode" onchange="start()">
      <option value="all">全部</option>
      <option value="image">添付画像語</option>
      <option value="kanken">漢検5級1026字</option>
      <option value="wrong">間違い復習</option>
    </select>
    <button onclick="undo()">一画戻す</button>
    <button onclick="clearPad()">消す</button>
    <button class="warn" onclick="recognizeNow()">自動判定</button>
    <button class="primary" onclick="next()">次</button>
    <label class="toggle"><input id="ghostToggle" type="checkbox" onchange="drawGhost()">薄い答え</label>
  </div>
  <div class="small">判定：認識候補＋形比較のゆる判定。結果には漢字画像と一画ずつの書き順アニメを表示。</div>
</footer>
</div>
<canvas id="fallbackRef" width="320" height="320" style="display:none"></canvas>
<canvas id="fallbackTmp" width="320" height="320" style="display:none"></canvas>

  for(let y=0;y<sh;y++){for(let x=0;x<sw;x++){const i=(y*sw+x)*4;const r=data[i],gg=data[i+1],b=data[i+2],a=data[i+3];const dark=(r+gg+b)/3<220;const saturated=(Math.max(r,gg,b)-Math.min(r,gg,b))>28;if(a>20&&(dark||saturated)&&!(r>230&&gg>230&&b>230)){const gray=Math.abs(r-gg)<8&&Math.abs(gg-b)<8&&r>145;if(gray)continue;minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y);ink++}}}
  if(!ink)return;const bW=Math.max(1,maxX-minX+1),bH=Math.max(1,maxY-minY+1),margin=30,scale=Math.min((320-margin*2)/bW,(320-margin*2)/bH),dw=bW*scale,dh=bH*scale,dx=(320-dw)/2,dy=(320-dh)/2;g.drawImage(srcCanvas,minX,minY,bW,bH,dx,dy,dw,dh);
  const outImg=g.getImageData(0,0,320,320),od=outImg.data;for(let i=0;i<od.length;i+=4){const r=od[i],gg=od[i+1],b=od[i+2],a=od[i+3];const dark=(r+gg+b)/3<235;const saturated=(Math.max(r,gg,b)-Math.min(r,gg,b))>25;if(a>20&&(dark||saturated)&&!(r>245&&gg>245&&b>245)){od[i]=0;od[i+1]=0;od[i+2]=0;od[i+3]=255}else{od[i]=255;od[i+1]=255;od[i+2]=255;od[i+3]=255}}g.putImageData(outImg,0,0);
}
window.addEventListener('resize',()=>{resizeCanvas();if(!engineReady)fallbackRedraw()});
window.addEventListener('load',()=>setTimeout(initEngine,500));
</script>

<script src="../../firebase-config.js"></script>
<script id="periodic-test-score-addon">
(function(){
  const META={id:"high-kanji",name:"高校 漢字"};
  const KEY='periodicTestBest:'+META.id;
  const LAST='periodicTestLast:'+META.id;
  const STYLE_ID='periodic-test-style';
  const USER_KEY='gakushuScoreUserId';
  let firebaseState='確認中';
  let fbCache=null;
  function $(id){return document.getElementById(id)}
  function safeId(s){return String(s||'default').replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,80)||'default'}
  function getUserId(){
    let id=localStorage.getItem(USER_KEY);
    if(!id){id='guest-'+(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2));localStorage.setItem(USER_KEY,id)}
    return safeId(id);
  }
  function firebaseConfigured(){
    const c=window.GAKUSHU_FIREBASE_CONFIG;
    return !!(c && c.apiKey && c.databaseURL && !String(c.apiKey).includes('PASTE_') && !String(c.databaseURL).includes('PASTE_'));
  }
  async function fb(){
    if(fbCache) return fbCache;
    if(!firebaseConfigured()){firebaseState='Firebase未設定・端末保存';return null;}
    try{
      const [{initializeApp,getApps},{getDatabase,ref,get,set,remove,onValue,serverTimestamp}]=await Promise.all([
        import('https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js')
      ]);
      const app=getApps().length?getApps()[0]:initializeApp(window.GAKUSHU_FIREBASE_CONFIG);
      const db=getDatabase(app);
      fbCache={db,ref,get,set,remove,onValue,serverTimestamp};
      firebaseState='Firebase DB同期ON';
      return fbCache;
    }catch(e){console.warn('Firebase init failed',e);firebaseState='Firebase接続失敗・端末保存';return null;}
  }
  function pathFor(){return 'scoreUsers/'+getUserId()+'/subjects/'+META.id}
  function readBest(){const v=localStorage.getItem(KEY); return v==null?null:Number(v)}
  async function readRemoteBest(){
    const f=await fb(); if(!f) return null;
    try{const snap=await f.get(f.ref(f.db,pathFor())); const v=snap.exists()?snap.val():null; return v&&typeof v.best==='number'?v.best:null}catch(e){console.warn(e);return null}
  }
  async function writeRemoteBest(score){
    const f=await fb(); if(!f) return;
    try{
      const p=f.ref(f.db,pathFor());
      const snap=await f.get(p); const old=snap.exists()?snap.val():null; const oldBest=old&&typeof old.best==='number'?old.best:null;
      if(oldBest==null || score>oldBest){
        await f.set(p,{best:score,subjectName:META.name,subjectId:META.id,updatedAt:f.serverTimestamp(),lastScore:score,scoreUserId:getUserId()});
        firebaseState='Firebase DB同期済';
      }else{
        // 最高点更新なしでも最終点だけ持つ
        await f.set(p,{...(old||{}),best:oldBest,subjectName:META.name,subjectId:META.id,updatedAt:f.serverTimestamp(),lastScore:score,scoreUserId:getUserId()});
        firebaseState='Firebase DB同期済';
      }
      updatePanel();
    }catch(e){console.warn('Firebase write failed',e);firebaseState='Firebase書込失敗・端末保存';updatePanel();}
  }
  async function removeRemoteBest(){const f=await fb(); if(!f)return; try{await f.remove(f.ref(f.db,pathFor())); firebaseState='Firebase DBリセット済';}catch(e){console.warn(e);firebaseState='Firebaseリセット失敗';}}
  async function syncFromRemote(){
    const rb=await readRemoteBest();
    if(rb!=null){const lb=readBest(); if(lb==null||rb>lb)localStorage.setItem(KEY,String(rb));}
    updatePanel();
  }
  async function watchRemote(){
    const f=await fb(); if(!f)return;
    try{f.onValue(f.ref(f.db,pathFor()),snap=>{const v=snap.val(); if(v&&typeof v.best==='number'){const lb=readBest(); if(lb==null||v.best>=lb)localStorage.setItem(KEY,String(v.best));}else{localStorage.removeItem(KEY)} updatePanel();});}catch(e){console.warn(e)}
  }
  function writeBest(score){
    score=Math.max(0,Math.min(100,Math.round(Number(score)||0)));
    const old=readBest();
    localStorage.setItem(LAST, JSON.stringify({score,at:new Date().toISOString(),name:META.name,scoreUserId:getUserId()}));
    if(old==null || score>old){localStorage.setItem(KEY,String(score));}
    updatePanel();
    writeRemoteBest(score);
  }
  window.__recordPeriodicTestScore=function(score){writeBest(score)};
  window.__resetPeriodicTestBest=async function(){if(confirm(META.name+' の歴代最高得点をFirebase DBごとリセットする？')){localStorage.removeItem(KEY);localStorage.removeItem(LAST);await removeRemoteBest();updatePanel();}};
  function ensurePanel(){
    if(!$(STYLE_ID)){
      const st=document.createElement('style');st.id=STYLE_ID;st.textContent=`
      .ptsPanel{position:fixed;right:10px;bottom:10px;z-index:2147483000;background:rgba(15,23,42,.92);color:#fff;border:1px solid rgba(148,163,184,.45);border-radius:16px;padding:10px 12px;box-shadow:0 12px 30px rgba(0,0,0,.35);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:270px}
      .ptsPanel b{display:block;font-size:13px;letter-spacing:.02em}.ptsBest{font-size:18px;font-weight:1000;color:#fde68a;margin-top:2px}.ptsRow{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.ptsRow button{border:0;border-radius:999px;padding:7px 9px;font-weight:900;background:#2563eb;color:white}.ptsRow button.reset{background:#475569}.ptsMini{font-size:11px;color:#cbd5e1;font-weight:800;line-height:1.35;margin-top:4px}.ptsFb{font-size:11px;color:#93c5fd;font-weight:900;margin-top:3px}@media(max-width:560px){.ptsPanel{left:8px;right:8px;bottom:6px;max-width:none;display:flex;align-items:center;justify-content:space-between;gap:8px}.ptsRow{margin-top:0}.ptsMini,.ptsFb{display:none}}`;
      document.head.appendChild(st);
    }
    if($('periodicTestPanel')) return;
    const div=document.createElement('div');div.className='ptsPanel';div.id='periodicTestPanel';div.innerHTML=`<div><b>定期テスト対策テスト</b><div class="ptsBest" id="periodicBest">最高 --点</div><div class="ptsMini">完走点をFirebase DBに歴代最高で保存</div><div class="ptsFb" id="periodicFbState">Firebase確認中</div></div><div class="ptsRow"><button type="button" id="periodicManual">今の点を記録</button><button type="button" class="reset" id="periodicReset">リセット</button></div>`;
    document.body.appendChild(div);
    $('periodicManual').onclick=()=>{const s=extractScore(); if(s==null){alert('まだ点数を検出できない。最後まで解いてから押して。');return} writeBest(s); alert(META.name+'：'+s+'点を記録した。')};
    $('periodicReset').onclick=window.__resetPeriodicTestBest;
    updatePanel();
  }
  function updatePanel(){const b=readBest(); const el=$('periodicBest'); if(el)el.textContent=b==null?'最高 --点':'最高 '+b+'点'; const fbEl=$('periodicFbState'); if(fbEl)fbEl.textContent=firebaseState+' / ID:'+getUserId();}
  function num(s){const n=Number(String(s||'').replace(/[^0-9.]/g,''));return Number.isFinite(n)?n:null}
  function scoreFromOkTotal(ok,total){ok=Number(ok);total=Number(total); if(!total||total<1)return null; return Math.round(ok/total*100)}
  function extractScore(){
    const bodyText=(document.body&&document.body.innerText)||'';
    let best=null;
    const patterns=[/正解\s*([0-9]+)\s*\/\s*([0-9]+)/g,/([0-9]+)問中\s*([0-9]+)問正解/g,/([0-9]+)\s*\/\s*([0-9]+)\s*問/g];
    for(const re of patterns){let m; while((m=re.exec(bodyText))){let a=Number(m[1]),b=Number(m[2]); let sc=null; if(re.source.startsWith('([0-9]+)問中')) sc=scoreFromOkTotal(b,a); else sc=scoreFromOkTotal(a,b); if(sc!=null)best=sc;}}
    let m=bodyText.match(/(?:得点|スコア|点数)[^0-9]{0,8}([0-9]{1,3})\s*点/); if(m)best=Math.max(0,Math.min(100,Number(m[1])));
    m=bodyText.match(/([0-9]{1,3})\s*点相当/); if(m)best=Math.max(0,Math.min(100,Number(m[1])));
    const scoreEl=$('score'); if(scoreEl){const n=num(scoreEl.textContent); if(n!=null&&n>=0&&n<=100)best=Math.round(n)}
    return best;
  }
  function completionSignal(){
    const t=(document.body&&document.body.innerText)||'';
    if(/終了|完了|最後|1周終わり|テスト終了|全問終了/.test(t)) return true;
    const qno=$('qno')?.textContent||''; const m=qno.match(/([0-9]+)\s*\/\s*([0-9]+)/); if(m&&Number(m[1])>=Number(m[2])&&Number(m[2])>0&&/正解\s*[0-9]+\s*\//.test(t))return true;
    return false;
  }
  let recordedAt=0;
  function maybeRecord(){
    if(Date.now()-recordedAt<1500)return;
    if(!completionSignal())return;
    const s=extractScore();
    if(s==null)return;
    recordedAt=Date.now(); writeBest(s);
  }
  const oldAlert=window.alert;
  window.alert=function(msg){try{if(String(msg).match(/1周終わり|終了|完了/)){setTimeout(maybeRecord,50)}}catch(e){} return oldAlert.apply(this,arguments)};
  window.addEventListener('storage',()=>syncFromRemote());
  window.addEventListener('load',()=>{ensurePanel(); syncFromRemote(); watchRemote(); setInterval(maybeRecord,1200); const mo=new MutationObserver(()=>maybeRecord()); mo.observe(document.body,{childList:true,subtree:true,characterData:true});});
})();
</script>
