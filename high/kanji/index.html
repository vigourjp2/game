<head>

<title>高校 漢字｜手書き自動認識テスト</title>
<style>
:root{--bg:#0f172a;--ink:#f8fafc;--muted:#cbd5e1;--line:#334155;--pri:#2563eb;--ok:#16a34a;--ng:#dc2626;--warn:#f97316}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
.top{padding:8px 10px calc(8px + env(safe-area-inset-top));background:linear-gradient(180deg,rgba(15,23,42,.98),rgba(15,23,42,.82));border-bottom:1px solid var(--line)}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.title{font-weight:900;font-size:14px;color:#93c5fd}.badge{border:1px solid var(--line);background:#1e293b;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:900;color:#dbeafe}
.q{font-weight:900;font-size:clamp(18px,4.8vw,30px);line-height:1.28;margin-top:6px}.sub{font-size:12px;color:var(--muted);font-weight:800;margin-top:4px;line-height:1.35}.score{margin-left:auto;color:#cbd5e1;font-weight:900;font-size:13px}
.canvasWrap{position:relative;min-height:0;background:#fff;touch-action:none}
#kanjiCanvas{display:block;width:100%;height:100%;background:#fff;touch-action:none;cursor:crosshair}
.guide{pointer-events:none;position:absolute;inset:0;background:
linear-gradient(to right,transparent calc(50% - .5px),rgba(148,163,184,.45) calc(50% - .5px),rgba(148,163,184,.45) calc(50% + .5px),transparent calc(50% + .5px)),
linear-gradient(to bottom,transparent calc(50% - .5px),rgba(148,163,184,.45) calc(50% - .5px),rgba(148,163,184,.45) calc(50% + .5px),transparent calc(50% + .5px))}
.guide:before{content:"";position:absolute;inset:10px;border:2px dashed rgba(148,163,184,.45);border-radius:18px}
.ghost{pointer-events:none;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(62vw,62vh);font-weight:900;color:rgba(15,23,42,.055);line-height:1}
.resultBox{display:none;position:absolute;left:10px;right:10px;bottom:10px;max-height:78vh;overflow:auto;background:rgba(15,23,42,.94);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:12px;box-shadow:0 14px 40px rgba(0,0,0,.28)}
.resultBox.open{display:block}.resultMain{font-size:clamp(24px,6.5vw,36px);font-weight:900}.okTxt{color:#86efac}.ngTxt{color:#fca5a5}.maybeTxt{color:#fde68a}.ans{font-size:clamp(48px,13vw,78px);font-weight:900;letter-spacing:.08em;line-height:1.05;margin-top:4px}.mean{color:#cbd5e1;font-weight:800;line-height:1.45;margin-top:4px}.cands{color:#bfdbfe;font-weight:900;line-height:1.5;margin-top:7px}

.strokeVisualHead{color:#fde68a;font-weight:900;font-size:clamp(16px,4.2vw,21px);margin-bottom:8px}
.strokeVisualBox{display:flex;justify-content:center;align-items:center;min-height:220px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.18);border-radius:14px;overflow:hidden}
#strokeVisual{width:220px;height:220px;display:flex;justify-content:center;align-items:center}
.strokeVisualNote{margin-top:8px;color:#dbeafe;font-size:clamp(13px,3.4vw,17px);font-weight:800;line-height:1.45}
.strokeCharFallback{font-size:148px;line-height:1;color:#fff;font-weight:900;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif}
.replayBtn{margin-top:8px;min-height:40px;padding:8px 14px;border:0;border-radius:12px;background:#1d4ed8;color:#fff;font-weight:900}
.bottom{padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(15,23,42,.98),rgba(15,23,42,.84));border-top:1px solid var(--line)}
button,select{border:0;border-radius:13px;padding:10px 10px;font-weight:900;color:#fff;background:#334155;font-size:13px;min-height:42px}select{background:#1e293b;border:1px solid #334155;max-width:150px}
button.primary{background:var(--pri)}button.ok{background:var(--ok)}button.ng{background:var(--ng)}button.warn{background:var(--warn)}button:active{transform:translateY(1px)}
.small{font-size:11px;color:#94a3b8;font-weight:700;line-height:1.25;margin-top:4px}.toggle{display:flex;gap:6px;align-items:center;color:#cbd5e1;font-size:12px;font-weight:800}input[type=checkbox]{width:18px;height:18px}
#candidateList{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden}
@media (orientation:landscape){.top{padding-top:5px}.q{font-size:20px}.sub,.small{display:none}.bottom{padding-top:5px}button,select{min-height:36px;padding:7px 9px}}

<body>
<div class="app">
<header class="top">
  <div class="row"><span class="title">高校 漢字 手書き自動認識</span><span class="badge">漢検5級1026字</span><span class="badge">添付画像語</span><span class="score" id="score">0問中 0問正解</span></div>
  <div class="q" id="question">開始を押してね</div>
  <div class="sub" id="status">GitHub PagesなどHTTPS環境推奨。画面いっぱいに一文字を書いて「自動判定」。</div>
</header>

<main class="canvasWrap">
  <canvas id="kanjiCanvas" data-candidate-list="candidateList"></canvas>
  <div class="guide"></div>
  <div class="ghost" id="ghost"></div>
  <div class="resultBox" id="resultBox">
    <div class="resultMain" id="resultMain">---</div>
    <div class="ans" id="answerText">---</div>
    <div class="mean" id="meaning">---</div>
    <div class="strokeVisualWrap">
      <div class="strokeVisualHead">正しい漢字の画像（書き順つき）</div>
      <div class="strokeVisualBox"><div id="strokeVisual"></div></div>
      <div class="strokeVisualNote" id="strokeVisualNote">---</div>
      <button class="replayBtn" type="button" onclick="replayStrokeVisual()">もう一回再生</button>
    </div>
    <div class="cands" id="candidates">---</div>
  </div>
  <div id="candidateList"></div>
</main>

<footer class="bottom">
  <div class="row">
    <button class="primary" onclick="start()">開始</button>
    <select id="mode" onchange="start()">
      <option value="all">全部</option>
      <option value="image">添付画像だけ</option>
      <option value="kanken">5級むずかしめ</option>
      <option value="wrong">間違い復習</option>
    </select>
    <button onclick="undo()">一画戻す</button>
    <button onclick="clearPad()">消す</button>
    <button class="warn" onclick="recognizeNow()">自動判定</button>
    <button class="primary" onclick="next()">次</button>
    <label class="toggle"><input id="ghostToggle" type="checkbox" onchange="drawGhost()">薄い答え</label>
  </div>
  <div class="small">判定：部首抜けは厳しめ。添付画像語＋5級むずかしめのみ。正解画像と書き順アニメを表示。</div>
</footer>
</div>
<canvas id="fallbackRef" width="320" height="320" style="display:none"></canvas>

      catch(e){ engineReady=false; attachFallbackDrawing(); }
    }else{
      engineReady=false; attachFallbackDrawing();
    }
    $('status').textContent = engineReady
      ? '認識エンジンOK。語の中に入る一文字を書いて「自動判定」。一文字語のときは意味も問題文に表示。'
      : '認識エンジン未読込。形比較で動作中。';
    start();
  }catch(e){
    const q=$('question'); if(q) q.textContent='読み込みエラー：ページを再読込してください';
    console.error(e);
  }
}
function normalizeCandidates(raw){if(!raw)return [];if(Array.isArray(raw))return raw.map(x=>String(x)).filter(Boolean);return String(raw).replace(/候補|認識候補|Candidates|candidate/gi,'').replace(/[\s,、|｜/／・]+/g,'').split('').filter(Boolean)}
function getCandidateList(){const el=$('candidateList');const txt=el?(el.textContent||el.innerText||''):'';return normalizeCandidates(txt)}
function recognizeNow(){
  if(!order.length)return;
  const ans=order[idx].char;
  let cands=[];
  if(window.KanjiCanvas && engineReady){
    try{
      const raw=KanjiCanvas.recognize('kanjiCanvas');
      cands=normalizeCandidates(raw);
      setTimeout(()=>{let domCands=getCandidateList(); if(!cands.length && domCands.length)cands=domCands; judgeCandidates(ans,cands);},80);
      return;
    }catch(e){cands=[]}
  }
  judgeCandidates(ans,cands);
}
function hasCriticalLeftPart(ch){
  // 部首を落としても別漢字として認識されやすい字は、候補順位だけで○にしない
  // 例：仰を「卯」っぽく書く、伯を「白」っぽく書く、保を「呆」っぽく書く等
  const ninben = "仰仮件体休位仲伯佐依俗候俳俵保俸値借傾偉傷備側働像優";
  const tehen = "扱抵択扶技抄把投折抜抱押拍拝拡括拾持指挙振捕捨探推接採掲握援損描提換授揮操担";
  const kihen = "机札杉材村束松板林枚枝枠柄柱査栄校株根格桜梅械棒植検極構権横樹";
  return ninben.includes(ch) || tehen.includes(ch) || kihen.includes(ch);
}
function judgeCandidates(ans,cands){
  cands=[...new Set(cands)];
  const pos=cands.indexOf(ans);
  const shape=fallbackScore(ans);
  const strictPart = hasCriticalLeftPart(ans);
  let msg,isOk=false,level='ng';

  if(strictPart){
    // 部首抜け対策：正解が1位でない限り、ゆるく○にしない
    // 仰を「卯」っぽく書いたケースなどは、候補に仰が出ても△止まり
    if(pos===0){
      isOk=true;level='ok';msg=`○ 正解！ 認識1位・形${shape}点`;
    }else if(pos===1 && shape>=55){
      isOk=true;level='ok';msg=`○ 正解扱い！ 候補2位・形${shape}点`;
    }else if(pos>=0 && pos<10){
      level='maybe';msg=`△ 部首を確認！ 正解候補${pos+1}位・形${shape}点`;
    }else if(shape>=70){
      level='maybe';msg=`△ 部首注意。見た目は近い（形${shape}点）`;
    }else{
      level='ng';msg=`× 部首不足の可能性（形${shape}点）`;
    }
  }else{
    if(pos===0){isOk=true;level='ok';msg=`○ 正解！ 認識1位・形${shape}点`;}
    else if(pos>0 && pos<5){isOk=true;level='ok';msg=`○ 正解扱い！ 候補${pos+1}位・形${shape}点`;}
    else if(pos>=5 && pos<10 && shape>=25){isOk=true;level='ok';msg=`○ 手書きOK！ 候補${pos+1}位・形${shape}点`;}
    else if(shape>=60){isOk=true;level='ok';msg=`○ 見た目OK！ 形${shape}点`;}
    else if(pos>=0 && pos<10){level='maybe';msg=`△ 正解候補あり（${pos+1}位）・形${shape}点`;}
    else if(shape>=35){level='maybe';msg=`△ 見た目は近い（形${shape}点）`;}
    else {level='ng';msg=`× たぶん違う（形${shape}点）`;}
  }
  finishJudge(isOk,msg,cands,level);
}

function finishJudge(isOk,msg,cands,level=''){ 
  const cur=order[idx];
  done++; if(isOk)ok++;
  if(isOk) wrongIds=wrongIds.filter(id=>id!==cur.id); else if(!wrongIds.includes(cur.id)) wrongIds.push(cur.id);
  safeSet('highKanjiWrong',JSON.stringify(wrongIds));
  updateScore();
  const cls=isOk?'okTxt':(level==='maybe'||msg.startsWith('△'))?'maybeTxt':'ngTxt';
  $('resultMain').className='resultMain '+cls;
  $('resultMain').textContent=msg;
  $('candidates').textContent=cands.length ? `認識候補：${cands.slice(0,10).join('、')}` : '認識候補：なし';
  showStrokeVisual(cur.char);
  $('resultBox').classList.add('open');
}
function loadHanziWriterData(char,onComplete){ 
  const urls=[
    `https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/${encodeURIComponent(char)}.json`,
    `https://unpkg.com/hanzi-writer-data@2.0/${encodeURIComponent(char)}.json`
  ];
  (function tryNext(i){if(i>=urls.length){onComplete(null);return}fetch(urls[i]).then(r=>{if(!r.ok)throw new Error('fetch failed');return r.json()}).then(data=>onComplete(data)).catch(()=>tryNext(i+1));})(0);
}
function showStrokeVisual(ch){ 
  const el=$('strokeVisual'),note=$('strokeVisualNote'); if(!el||!note)return;
  el.innerHTML=''; note.textContent=`「${ch}」の正しい字形と書き順を表示中…`; currentStrokeWriter=null;
  if(window.HanziWriter){ 
    try{ 
      currentStrokeWriter=HanziWriter.create('strokeVisual',ch,{width:220,height:220,padding:10,showOutline:true,showCharacter:false,strokeAnimationSpeed:.85,delayBetweenStrokes:180,outlineColor:'rgba(255,255,255,0.25)',strokeColor:'#ffffff',radicalColor:'#60a5fa',charDataLoader:(char,onComplete)=>loadHanziWriterData(char,onComplete)});
      note.textContent=`「${ch}」の正しい漢字画像。上で一画ずつ再生する。`;
      setTimeout(()=>{try{currentStrokeWriter.animateCharacter()}catch(e){}},80); return;
    }catch(e){}
  }
  el.innerHTML=`<div class="strokeCharFallback">${ch}</div>`;
  note.textContent=`ネット読込できないため「${ch}」の字だけ表示。`;
}
function replayStrokeVisual(){if(currentStrokeWriter && currentStrokeWriter.animateCharacter){try{currentStrokeWriter.animateCharacter();return}catch(e){}} const cur=order[idx]; if(cur)showStrokeVisual(cur.char)}

/* fallback drawing / shape score */
function attachFallbackDrawing(){const ctx=canvas.getContext('2d');canvas.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;canvas.setPointerCapture(e.pointerId);curStroke=[pos(e)];strokes.push(curStroke);});canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();curStroke.push(pos(e));fallbackRedraw();});function end(e){if(!drawing)return;drawing=false;e.preventDefault();}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end)}
function fallbackRedraw(){if(!canvas)return;const ctx=canvas.getContext('2d'),r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);strokes.forEach(s=>{if(s.length<2)return;ctx.beginPath();ctx.moveTo(s[0].x,s[0].y);for(let i=1;i<s.length;i++){const p=s[i],pr=s[i-1],mx=(p.x+pr.x)/2,my=(p.y+pr.y)/2;ctx.quadraticCurveTo(pr.x,pr.y,mx,my)}ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0f172a';ctx.lineWidth=11;ctx.stroke()})}
function fallbackScore(ch){renderFallbackUser();renderFallbackRef(ch);const ref=$('fallbackRef').getContext('2d').getImageData(0,0,320,320).data;const usr=$('fallbackTmp').getContext('2d').getImageData(0,0,320,320).data;let overlap=0,userInk=0,refInk=0,near=0,W=320,H=320,rm=new Uint8Array(W*H),um=new Uint8Array(W*H);for(let i=0,p=0;i<ref.length;i+=4,p++){rm[p]=ref[i]<180?1:0;um[p]=usr[i]<200?1:0;if(rm[p])refInk++;if(um[p])userInk++;if(rm[p]&&um[p])overlap++}for(let y=3;y<H-3;y++)for(let x=3;x<W-3;x++){const p=y*W+x;if(!um[p])continue;let hit=false;for(let dy=-3;dy<=3&&!hit;dy++)for(let dx=-3;dx<=3;dx++){if(rm[(y+dy)*W+x+dx]){hit=true;break}}if(hit)near++}const precision=userInk?near/userInk:0,recall=refInk?overlap/refInk:0,density=Math.min(userInk,refInk)/Math.max(userInk,refInk||1);return Math.round((precision*.70+recall*.12+density*.18)*100)}
function renderFallbackRef(ch){const c=$('fallbackRef'),g=c.getContext('2d');g.clearRect(0,0,320,320);g.fillStyle='#fff';g.fillRect(0,0,320,320);g.fillStyle='#000';g.textAlign='center';g.textBaseline='middle';g.font='260px "Yu Mincho","Hiragino Mincho ProN","Noto Serif CJK JP",serif';g.fillText(ch,160,174)}
function renderFallbackUser(){ 
  const out=$('fallbackTmp'),g=out.getContext('2d');g.clearRect(0,0,320,320);g.fillStyle='#fff';g.fillRect(0,0,320,320);
  const srcCanvas=$('kanjiCanvas');const sw=srcCanvas.width,sh=srcCanvas.height;if(!sw||!sh)return;const sctx=srcCanvas.getContext('2d');let img;try{img=sctx.getImageData(0,0,sw,sh)}catch(e){return}
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity,ink=0;const data=img.data;
  for(let y=0;y<sh;y++){for(let x=0;x<sw;x++){const i=(y*sw+x)*4;const r=data[i],gg=data[i+1],b=data[i+2],a=data[i+3];const dark=(r+gg+b)/3<220;const saturated=(Math.max(r,gg,b)-Math.min(r,gg,b))>28;if(a>20&&(dark||saturated)&&!(r>230&&gg>230&&b>230)){const gray=Math.abs(r-gg)<8&&Math.abs(gg-b)<8&&r>145;if(gray)continue;minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y);ink++}}}
  if(!ink)return;const bW=Math.max(1,maxX-minX+1),bH=Math.max(1,maxY-minY+1),margin=30,scale=Math.min((320-margin*2)/bW,(320-margin*2)/bH),dw=bW*scale,dh=bH*scale,dx=(320-dw)/2,dy=(320-dh)/2;g.drawImage(srcCanvas,minX,minY,bW,bH,dx,dy,dw,dh);
  const outImg=g.getImageData(0,0,320,320),od=outImg.data;for(let i=0;i<od.length;i+=4){const r=od[i],gg=od[i+1],b=od[i+2],a=od[i+3];const dark=(r+gg+b)/3<235;const saturated=(Math.max(r,gg,b)-Math.min(r,gg,b))>25;if(a>20&&(dark||saturated)&&!(r>245&&gg>245&&b>245)){od[i]=0;od[i+1]=0;od[i+2]=0;od[i+3]=255}else{od[i]=255;od[i+1]=255;od[i+2]=255;od[i+3]=255}}g.putImageData(outImg,0,0);
}
window.addEventListener('resize',()=>{resizeCanvas();if(!engineReady)fallbackRedraw()});
window.addEventListener('load',()=>setTimeout(initEngine,500));
