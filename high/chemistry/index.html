:#fef3c7;color:#854d0e;border-radius:999px;padding:7px 10px;font-weight:900}.qno{font-weight:900;color:var(--muted)}.question{font-size:clamp(20px,4vw,30px);font-weight:900;line-height:1.45;margin:14px 0}.choices{display:grid;gap:10px}.choice{text-align:left;background:#fff;border:2px solid #fde68a;color:var(--ink);box-shadow:none;border-radius:18px;padding:14px 16px;font-size:18px;justify-content:flex-start}.choice.correct{border-color:#16a34a;background:#dcfce7}.choice.wrong{border-color:#dc2626;background:#fee2e2}.result{font-weight:900;font-size:18px;line-height:1.6}.result.ok{color:#15803d}.result.ng{color:#b91c1c}.explain{color:#475569;font-weight:700;line-height:1.7;margin-top:8px}.hidden{display:none!important}.memo{width:100%;min-height:80px;border-radius:16px;border:1px solid var(--line);padding:12px;font-weight:700}.foot{color:#64748b;font-size:13px;line-height:1.7}.modal{position:fixed;inset:0;background:rgba(15,23,42,.62);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.open{display:flex}.modalCard{width:min(940px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:28px;padding:18px;box-shadow:0 24px 80px rgba(0,0,0,.25)}.modalTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}.modalTop h2{margin:0;font-size:24px}.refsvg{width:100%;height:auto;border:1px solid #e2e8f0;border-radius:20px;background:#fff}.cards{display:grid;grid-template-columns:1fr 2fr;gap:0;border:1px solid #fde68a;border-radius:18px;overflow:hidden}.cards b,.cards span{padding:12px;border-bottom:1px solid #fde68a}.cards b{background:#fffbeb;color:#854d0e}.cards span{background:#fff}.cards b:last-of-type,.cards span:last-child{border-bottom:0}.ref h3{font-size:24px;margin:0 0 12px}@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.choice{font-size:16px}.cards{grid-template-columns:1fr}}

</head><body><div class="wrap"><header><h1>高校 化学 4択テスト</h1><p class="lead">添付画像の範囲を中心に、物質の分類・分離精製・三態・原子構造・電子配置・周期表・イオンまでを模擬テスト化。図が必要な問題は <b>📖 参照を見る</b> で確認できる。</p><div class="badges"><span class="badge">全108問</span><span class="badge">50問100点モード</span><span class="badge">図表ポップアップ</span><span class="badge">弱点復習</span></div></header>
<section class="panel"><div class="stats"><div class="stat"><span>問題数</span><b id="total">0</b></div><div class="stat"><span>正解</span><b id="ok">0</b></div><div class="stat"><span>得点</span><b id="score">0</b></div><div class="stat"><span>正答率</span><b id="rate">0%</b></div></div><div class="row" style="margin-top:12px"><select id="mode"><option value="all">全問シャッフル</option><option value="exam">本番 50問100点</option><option value="wrong">間違いだけ復習</option></select><select id="cat"><option value="">全カテゴリ</option></select><button onclick="start()">開始／やり直し</button><button class="secondary" onclick="speak(current?.prompt||'')">問題読み上げ</button><a class="btn secondary" href="../../index.html">TOPへ</a></div></section>
<section class="panel" id="quiz"><div class="qhead"><span class="tag" id="qcat">カテゴリ</span><span class="qno" id="qno">0 / 0</span></div><div id="figBtnArea" class="row"></div><div class="question" id="prompt">開始を押してね。</div><div class="choices" id="choices"></div><div id="res" class="result"></div><div id="exp" class="explain"></div><div class="row" style="margin-top:14px"><button id="nextBtn" class="good hidden" onclick="next()">次へ</button><button class="secondary" onclick="showAnswer()">答えを見る</button></div></section>
<section class="panel"><h2>弱点メモ</h2><textarea id="memo" class="memo" placeholder="まだなし"></textarea><div class="row" style="margin-top:10px"><button class="secondary" onclick="saveMemo()">保存</button><button class="secondary" onclick="clearProgress()">成績リセット</button></div></section><p class="foot">※参照図は学習用に描き直した整理図。添付画像の範囲に沿って、用語・分類・実験操作・電子配置・イオンのひっかけ選択肢を入れている。</p></div>
<div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="modalCard"><div class="modalTop"><h2 id="modalTitle">参照</h2><button class="secondary" onclick="closeModal()">閉じる</button></div><div id="modalBody"></div></div></div>
<script>const QUESTIONS=[{"cat": "物質の分類", "prompt": "物質を1種類の物質からなるものと、2種類以上の物質が混じったものに分けたとき、前者を何というか。", "choices": ["純物質", "混合物", "単体", "化合物"], "answer": "純物質", "exp": "純物質は一定の融点・沸点を示す。", "fig": "classification"}, {"cat": "物質の分類", "prompt": "2種類以上の物質が混じり合っているものを何というか。", "choices": ["混合物", "純物質", "単体", "元素"], "answer": "混合物", "exp": "混合物は成分の割合によって融点・沸点などが変わる。", "fig": "classification"}, {"cat": "物質の分類", "prompt": "純物質のうち、1種類の元素だけからできている物質を何というか。", "choices": ["単体", "化合物", "混合物", "溶液"], "answer": "単体", "exp": "O2、H2、Feなど。", "fig": "classification"}, {"cat": "物質の分類", "prompt": "純物質のうち、2種類以上の元素からできている物質を何というか。", "choices": ["化合物", "単体", "混合物", "元素"], "answer": "化合物", "exp": "H2O、NaCl、CO2など。", "fig": "classification"}, {"cat": "物質の分類", "prompt": "次のうち単体はどれか。", "choices": ["酸素 O2", "水 H2O", "塩化ナトリウム NaCl", "二酸化炭素 CO2"], "answer": "酸素 O2", "exp": "酸素は酸素原子だけからなる。", "fig": "classification"}, {"cat": "物質の分類", "prompt": "次のうち化合物はどれか。", "choices": ["水 H2O", "鉄 Fe", "酸素 O2", "銅 Cu"], "answer": "水 H2O", "exp": "水は水素と酸素からなる。", "fig": "classification"}, {"cat": "物質の分類", "prompt": "空気はどれに分類されるか。", "choices": ["混合物", "単体", "化合物", "元素"], "answer": "混合物", "exp": "窒素や酸素などが混じっている。", "fig": "classification"}, {"cat": "物質の分類", "prompt": "食塩水はどれに分類されるか。", "choices": ["混合物", "単体", "化合物", "元素"], "answer": "混合物", "exp": "水と塩化ナトリウムの混合物。", "fig": "classification"}, {"cat": "物質の分類", "prompt": "塩化ナトリウムはどれに分類されるか。", "choices": ["化合物", "単体", "混合物", "元素"], "answer": "化合物", "exp": "NaとClからできる純物質。", "fig": "classification"}, {"cat": "物質の性質", "prompt": "純物質と混合物を見分ける手がかりとして適切なものはどれか。", "choices": ["融点・沸点が一定かどうか", "色だけで決める", "質量が大きいかどうか", "容器の形"], "answer": "融点・沸点が一定かどうか", "exp": "純物質は融点・沸点が一定になりやすい。", "fig": "heating"}, {"cat": "分離・精製", "prompt": "蒸発しにくい物質と蒸発しやすい物質を、沸点の違いで分ける操作はどれか。", "choices": ["蒸留", "ろ過", "昇華", "クロマトグラフィー"], "answer": "蒸留", "exp": "水とエタノールの分離など。", "fig": "distillation"}, {"cat": "分離・精製", "prompt": "2種類以上の液体の混合物を成分ごとに分ける操作はどれか。", "choices": ["分留", "再結晶", "抽出", "沈殿"], "answer": "分留", "e let order=[],idx=0,ok=0,answered=false,current=null,wrongIds=JSON.parse(localStorage.getItem('highChemWrong')||'[]');const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function init(){$('total').textContent=QUESTIONS.length;const cats=[...new Set(QUESTIONS.map(q=>q.cat))];$('cat').innerHTML='<option value="">全カテゴリ</option>'+cats.map(c=>`<option>${c}</option>`).join('');$('memo').value=localStorage.getItem('highChemMemo')||'';start()}function start(){const mode=$('mode').value,cat=$('cat').value;let pool=QUESTIONS.map((q,i)=>({...q,id:i}));if(cat)pool=pool.filter(q=>q.cat===cat);if(mode==='wrong')pool=pool.filter(q=>wrongIds.includes(q.id));pool=shuffle(pool);if(mode==='exam')pool=pool.slice(0,50);if(pool.length===0){$('prompt').textContent='対象問題がない。全問モードでやり直して。';$('choices').innerHTML='';return}order=pool;idx=0;ok=0;answered=false;render()}function render(){current=order[idx];answered=false;$('qcat').textContent=current.cat;$('qno').textContent=`${idx+1} / ${order.length}`;$('prompt').textContent=current.prompt;$('res').textContent='';$('res').className='result';$('exp').textContent='';$('nextBtn').classList.add('hidden');$('figBtnArea').innerHTML=current.fig?`<button class="secondary" onclick="openFigure('${current.fig}')">📖 参照を見る</button>`:'';const choices=shuffle(current.choices);$('choices').innerHTML=choices.map(c=>`<button class="choice" onclick="choose(this, '${escapeJs(c)}')">${c}</button>`).join('');updateStats()}function escapeJs(s){return String(s).replace(/\/g,'\\').replace(/'/g,"\'").replace(/
/g,' ')}function choose(btn,val){if(answered)return;answered=true;[...document.querySelectorAll('.choice')].forEach(b=>{if(b.textContent===current.answer)b.classList.add('correct')});if(val===current.answer){ok++;$('res').textContent='正解！';$('res').classList.add('ok');wrongIds=wrongIds.filter(id=>id!==current.id)}else{btn.classList.add('wrong');$('res').textContent=`不正解。正解は「${current.answer}」。`;$('res').classList.add('ng');if(!wrongIds.includes(current.id))wrongIds.push(current.id)}localStorage.setItem('highChemWrong',JSON.stringify(wrongIds));$('exp').textContent=current.exp||'';$('nextBtn').classList.remove('hidden');updateStats()}function showAnswer(){if(answered)return;[...document.querySelectorAll('.choice')].forEach(b=>{if(b.textContent===current.answer)b.classList.add('correct')});$('res').textContent=`正解は「${current.answer}」。`;$('res').className='result ok';$('exp').textContent=current.exp||'';answered=true;$('nextBtn').classList.remove('hidden')}function next(){idx++;if(idx>=order.length){$('prompt').textContent=`終了！ 得点は ${Math.round(ok/order.length*100)}点相当。`;$('choices').innerHTML='';$('figBtnArea').innerHTML='';$('qno').textContent=`${order.length} / ${order.length}`;$('res').textContent=`正解 ${ok} / ${order.length}`;$('exp').textContent='間違いだけ復習モードで弱点をつぶそう。';$('nextBtn').classList.add('hidden');updateStats();return}render()}function updateStats(){$('ok').textContent=ok;const done=answered?idx+1:idx;const denom=order.length||1;$('score').textContent=order.length?Math.round(ok/denom*100):0;$('rate').textContent=done?Math.round(ok/done*100)+'%':'0%'}function openFigure(key){const f=FIGURES[key];if(!f)return;$('modalTitle').textContent=f.title;$('modalBody').innerHTML=f.html;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}function speak(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';speechSynthesis.speak(u)}catch(e){}}function saveMemo(){localStorage.setItem('highChemMemo',$('memo').value);alert('保存した')}function clearProgress(){localStorage.removeItem('highChemWrong');wrongIds=[];alert('リセットした')}init();</script>
<script src="../../firebase-config.js"></script>
<script id="periodic-test-score-addon">
(function(){
  const META={id:"high-chemistry",name:"高校 化学"};
  const FIXED_USER='gakushu-main';
  const KEY='periodicTestBest:'+META.id;
  const LAST='periodicTestLast:'+META.id;
  let firebaseState='確認中';
  let fbCache=null;
  function $(id){return document.getElementById(id)}
  function getUserId(){return FIXED_USER}
  function firebaseConfigured(){
    const c=window.GAKUSHU_FIREBASE_CONFIG;
    return !!(c&&c.apiKey&&c.databaseURL&&!String(c.apiKey).includes('PASTE_')&&!String(c.databaseURL).includes('PASTE_'));
  }
  async function fb(){
    if(fbCache)return fbCache;
    if(!firebaseConfigured()){firebaseState='Firebase未設定・一時端末保存';return null}
    try{
      const [appMod,dbMod]=await Promise.all([
        import('https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js')
      ]);
      const app=appMod.getApps().length?appMod.getApps()[0]:appMod.initializeApp(window.GAKUSHU_FIREBASE_CONFIG);
      const db=dbMod.getDatabase(app);
      fbCache={db,...dbMod};
      firebaseState='Firebase DB同期ON';
      return fbCache;
    }catch(e){console.warn('Firebase init failed',e);firebaseState='Firebase接続失敗・一時端末保存';return null}
  }
  function pathFor(){return 'scoreUsers/'+FIXED_USER+'/subjects/'+META.id}
  function readBest(){const v=localStorage.getItem(KEY);return v==null?null:Number(v)}
  async function readRemoteBest(){
    const f=await fb();if(!f)return null;
    try{const snap=await f.get(f.ref(f.db,pathFor()));const v=snap.exists()?snap.val():null;return v&&typeof v.best==='number'?v.best:null}catch(e){console.warn(e);return null}
  }
  async function writeRemoteBest(score){
    const f=await fb();if(!f)return;
    try{
      const p=f.ref(f.db,pathFor());
      const snap=await f.get(p);
      const old=snap.exists()?snap.val():null;
      const oldBest=old&&typeof old.best==='number'?old.best:null;
      const payload={...(old||{}),best:oldBest==null||score>oldBest?score:oldBest,subjectName:META.name,subjectId:META.id,updatedAt:f.serverTimestamp(),lastScore:score,scoreUserId:FIXED_USER};
      await f.set(p,payload);
      firebaseState='Firebase DB同期済';
      updateInlineBest();
    }catch(e){console.warn('Firebase write failed',e);firebaseState='Firebase書込失敗・一時端末保存';updateInlineBest()}
  }
  async function removeRemoteBest(){
    const f=await fb();if(!f)return;
    try{await f.remove(f.ref(f.db,pathFor()));firebaseState='Firebase DBリセット済'}catch(e){console.warn(e);firebaseState='Firebaseリセット失敗'}
  }
  function updateInlineBest(){
    const b=readBest();
    document.querySelectorAll('[data-periodic-best],.periodicBestInline').forEach(el=>{el.textContent=b==null?'最高 --点':'最高 '+b+'点'});
  }
  async function syncFromRemote(){
    const rb=await readRemoteBest();
    if(rb!=null){const lb=readBest();if(lb==null||rb>lb)localStorage.setItem(KEY,String(rb))}
    updateInlineBest();
  }
  async function watchRemote(){
    const f=await fb();if(!f)return;
    try{f.onValue(f.ref(f.db,pathFor()),snap=>{const v=snap.val();if(v&&typeof v.best==='number'){const lb=readBest();if(lb==null||v.best>=lb)localStorage.setItem(KEY,String(v.best))}else{localStorage.removeItem(KEY)}updateInlineBest()})}catch(e){console.warn(e)}
  }
  function writeBest(score){
    score=Math.max(0,Math.min(100,Math.round(Number(score)||0)));
    const old=readBest();
    localStorage.setItem(LAST,JSON.stringify({score,at:new Date().toISOString(),name:META.name,scoreUserId:FIXED_USER}));
    if(old==null||score>old){localStorage.setItem(KEY,String(score));writeRemoteBest(score);}
    else {writeRemoteBest(score);}
    updateInlineBest();
  }
  window.__recordPeriodicTestScore=function(score,opts){if(opts&&opts.completed===false)return;writeBest(score)};
  window.__resetPeriodicTestBest=async function(){
    if(confirm(META.name+' の歴代最高得点をリセットする？')){localStorage.removeItem(KEY);localStorage.removeItem(LAST);await removeRemoteBest();updateInlineBest()}
  };
  function ensureInlineInfo(){
    const old=$('periodicTestPanel');if(old)old.remove();
    let host=document.querySelector('[data-periodic-host]')||document.querySelector('header')||document.body.firstElementChild||document.body;
    if(!document.querySelector('.periodicBestInline')){
      const box=document.createElement('div');
      box.className='periodicBestInlineBox';
      box.innerHTML='<span>定期テスト最高：</span><b class="periodicBestInline" data-periodic-best>最高 --点</b><button type="button" class="periodicResetInline">リセット</button>';
      const st=document.createElement('style');
      st.textContent='.periodicBestInlineBox{position:static!important;z-index:auto!important;margin:8px 12px;padding:8px 10px;border:1px solid rgba(148,163,184,.35);border-radius:12px;background:rgba(15,23,42,.06);font-weight:900;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.periodicBestInlineBox button{border:0;border-radius:999px;padding:6px 10px;background:#64748b;color:white;font-weight:900}';
      document.head.appendChild(st);
      if(host===document.body)document.body.insertBefore(box,document.body.firstChild);else host.appendChild(box);
      box.querySelector('button').onclick=window.__resetPeriodicTestBest;
    }
    updateInlineBest();
  }
  function scoreFromOkTotal(ok,total){ok=Number(ok);total=Number(total);if(!total||total<1)return null;return Math.round(ok/total*100)}
  function num(s){const n=Number(String(s||'').replace(/[^0-9.]/g,''));return Number.isFinite(n)?n:null}
  function extractScore(){
    const bodyText=(document.body&&document.body.innerText)||'';
    let best=null;
    const patterns=[/正解\s*([0-9]+)\s*\/\s*([0-9]+)/g,/([0-9]+)問中\s*([0-9]+)問正解/g,/([0-9]+)\s*\/\s*([0-9]+)\s*問/g];
    for(const re of patterns){let m;while((m=re.exec(bodyText))){let a=Number(m[1]),b=Number(m[2]);let sc=null;if(re.source.startsWith('([0-9]+)問中'))sc=scoreFromOkTotal(b,a);else sc=scoreFromOkTotal(a,b);if(sc!=null)best=sc}}
    let m=bodyText.match(/(?:得点|スコア|点数)[^0-9]{0,8}([0-9]{1,3})\s*点/);if(m)best=Math.max(0,Math.min(100,Number(m[1])));
    m=bodyText.match(/([0-9]{1,3})\s*点相当/);if(m)best=Math.max(0,Math.min(100,Number(m[1])));
    const scoreEl=$('score');if(scoreEl){const n=num(scoreEl.textContent);if(n!=null&&n>=0&&n<=100)best=Math.round(n)}
    return best;
  }
  function completionSignal(){
    const t=(document.body&&document.body.innerText)||'';
    if(/終了|完了|最後|1周終わり|テスト終了|全問終了|結果/.test(t))return true;
    const qno=$('qno')?.textContent||'';const m=qno.match(/([0-9]+)\s*\/\s*([0-9]+)/);
    if(m&&Number(m[1])>=Number(m[2])&&Number(m[2])>0&&/正解\s*[0-9]+\s*\//.test(t))return true;
    const m2=t.match(/([0-9]+)問中\s*([0-9]+)問正解/);
    if(m2&&Number(m2[1])>0)return true;
    return false;
  }
  let recordedAt=0,lastScoreKey='';
  function maybeRecord(){
    if(Date.now()-recordedAt<1500)return;
    if(!completionSignal())return;
    const s=extractScore();if(s==null)return;
    const key=String(s)+'|'+((document.body&&document.body.innerText)||'').slice(0,80);
    if(key===lastScoreKey)return;
    lastScoreKey=key;recordedAt=Date.now();writeBest(s);
  }
  const oldAlert=window.alert;
  window.alert=function(msg){try{if(String(msg).match(/1周終わり|終了|完了|結果/))setTimeout(maybeRecord,50)}catch(e){}return oldAlert.apply(this,arguments)};
  window.addEventListener('storage',()=>syncFromRemote());
  window.addEventListener('load',()=>{ensureInlineInfo();syncFromRemote();watchRemote();setInterval(maybeRecord,1200);const mo=new MutationObserver(()=>maybeRecord());mo.observe(document.body,{childList:true,subtree:true,characterData:true})});
})();
</script>
