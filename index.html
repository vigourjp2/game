<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>社会テスト4択ゲーム｜中1 前期中間</title>
<style>
:root{--bg:#08111f;--card:#121f33;--card2:#0d1728;--txt:#f4f7ff;--muted:#aab7d0;--accent:#67e8f9;--ok:#39e58c;--ng:#ff5b7d;--warn:#ffd166;--line:#263858;--btn:#1b2b48}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#18335f 0,#08111f 42%,#050912 100%);color:var(--txt);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100svh}.wrap{max-width:1060px;margin:auto;padding:14px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.title{font-size:clamp(22px,5vw,42px);font-weight:900;letter-spacing:.03em}.sub{color:var(--muted);font-size:14px}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:rgba(255,255,255,.05);font-weight:700}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:14px}@media(max-width:820px){.grid{grid-template-columns:1fr}.wrap{padding:10px}}.panel{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.qNo{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-weight:700}.cat{color:#001018;background:var(--accent);padding:5px 10px;border-radius:999px;font-size:12px}.q{font-size:clamp(20px,4vw,30px);font-weight:900;line-height:1.35;margin:16px 0 14px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;border:1px solid var(--line);background:var(--btn);color:var(--txt);padding:14px 14px;border-radius:16px;font-size:18px;font-weight:800;cursor:pointer;transition:.12s transform,.12s border-color,.12s background}.choice:hover{transform:translateY(-1px);border-color:var(--accent)}.choice.correct{background:rgba(57,229,140,.16);border-color:var(--ok)}.choice.wrong{background:rgba(255,91,125,.16);border-color:var(--ng)}.choice:disabled{cursor:default}.explain{display:none;margin-top:14px;border-left:5px solid var(--accent);background:rgba(103,232,249,.08);padding:12px;border-radius:12px;color:#eafaff;line-height:1.65}.explain.show{display:block}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid var(--line);background:#182946;color:var(--txt);padding:11px 14px;border-radius:14px;font-weight:900;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#16c5d8,#7c3aed);border:0}.btn.danger{background:#3a1622;border-color:#713042}.btn.good{background:#123321;border-color:#2b8b59}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}.num{font-size:28px;font-weight:1000}.label{font-size:12px;color:var(--muted);font-weight:700}.bar{height:12px;background:#07101e;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:12px 0}.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--ng),var(--warn),var(--ok));transition:.25s}.selects{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}@media(max-width:520px){.selects{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}.choice{font-size:16px}}select,input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#091527;color:var(--txt);padding:10px;font-weight:700}.mini{font-size:13px;color:var(--muted);line-height:1.6}.list{max-height:250px;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:8px;background:rgba(0,0,0,.13)}.miss{padding:8px;border-bottom:1px solid #223452}.miss:last-child{border-bottom:0}.flash{animation:pop .25s}@keyframes pop{50%{transform:scale(1.02)}}.bigResult{font-size:20px;font-weight:1000;margin-top:10px}.okTxt{color:var(--ok)}.ngTxt{color:var(--ng)}.warnTxt{color:var(--warn)}details{margin-top:14px}summary{cursor:pointer;font-weight:900}.editBox{display:grid;gap:8px;margin-top:10px}.footer{opacity:.7;text-align:center;margin:16px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="title">社会テスト 4択ゲーム</div><div class="sub">最優先ワーク範囲：世界の姿①②／日本の姿①②／時差／都道府県／総合問題</div></div>
    <div class="pill">index.html 1ファイル版</div>
  </div>
  <div class="grid">
    <main class="panel" id="main">
      <div class="qNo"><span id="progress">Q 1 / 1</span><span class="cat" id="cat">カテゴリ</span></div>
      <div class="bar"><div id="bar"></div></div>
      <div class="q" id="question">読み込み中</div>
      <div class="choices" id="choices"></div>
      <div class="explain" id="explain"></div>
      <div class="controls">
        <button class="btn primary" id="nextBtn">次の問題 ▶</button>
        <button class="btn" id="speakBtn">問題を読む</button>
        <button class="btn good" id="reviewBtn">間違いだけ復習</button>
        <button class="btn danger" id="resetBtn">成績リセット</button>
      </div>
    </main>
    <aside class="panel">
      <div class="stats">
        <div class="stat"><div class="num" id="seen">0</div><div class="label">回答</div></div>
        <div class="stat"><div class="num" id="ok">0</div><div class="label">正解</div></div>
        <div class="stat"><div class="num" id="rate">0%</div><div class="label">正答率</div></div>
      </div>
      <div class="selects">
        <select id="mode"><option value="all">全部シャッフル</option><option value="weak">苦手優先</option><option value="new">未回答優先</option></select>
        <select id="category"></select>
      </div>
      <div class="mini">画像のワーク内容を4択化。まずは「全部シャッフル」、間違えたら「間違いだけ復習」で潰す。答えだけ暗記じゃなく、解説も一緒に覚えるやつ。</div>
      <h3>間違いリスト</h3>
      <div class="list" id="missList"><div class="mini">まだ間違いなし。えらい。</div></div>
      <details>
        <summary>問題追加・編集</summary>
        <div class="editBox">
          <input id="newQ" placeholder="問題文">
          <input id="newA" placeholder="正解">
          <input id="newW" placeholder="誤答3つをカンマ区切り 例: 中国,韓国,ロシア">
          <input id="newC" placeholder="カテゴリ 例: 追加問題">
          <textarea id="newE" placeholder="解説"></textarea>
          <button class="btn primary" id="addBtn">問題を追加して保存</button>
          <button class="btn" id="exportBtn">問題データを書き出し</button>
          <textarea id="importBox" placeholder="書き出したJSONを貼って読み込み"></textarea>
          <button class="btn" id="importBtn">読み込み</button>
        </div>
      </details>
    </aside>
  </div>
  <div class="footer">保存はこの端末のブラウザ内。ネット不要で動く。</div>
</div>
<script>
const BASE_QUESTIONS = [
{c:'世界の国',q:'キョウザが代表的な料理で、漢字がもともとこの国の文字で、巨大な人口を抱える国は？',a:'中国',w:['韓国','インド','ロシア'],e:'ワークの国あて問題。キョウザ・漢字・人口の多さがヒントなら中国。'},
{c:'世界の国',q:'ハングルという文字があり、民族衣装はチマ・チョゴリ、日本のとなりの国は？',a:'韓国',w:['中国','ロシア','モンゴル'],e:'ハングルとチマ・チョゴリが大きな手がかり。'},
{c:'世界の国',q:'スパイス料理が伝統的で、人口の約80％がヒンドゥー教を信仰し、数学が発達した国は？',a:'インド',w:['エジプト','ブラジル','イギリス'],e:'カレーなどのスパイス料理、ヒンドゥー教、数学の発達はインド。'},
{c:'世界の国',q:'ラグビーの生まれた国で、紅茶を飲むのが習慣、国旗はユニオンジャックの国は？',a:'イギリス',w:['フランス','アメリカ','カナダ'],e:'ラグビー、紅茶、ユニオンジャックがそろえばイギリス。'},
{c:'世界の国',q:'外側がかたくて細長いパンが有名。エッフェル塔があるヨーロッパ最大級の農業国は？',a:'フランス',w:['ドイツ','イタリア','ロシア'],e:'フランスパン・エッフェル塔・農業国がヒント。'},
{c:'世界の国',q:'ボルシチなど赤いビーツを使った伝統料理があり、世界一長いシベリア鉄道が走る国は？',a:'ロシア',w:['カナダ','中国','ドイツ'],e:'ボルシチとシベリア鉄道はロシア。'},
{c:'世界の国',q:'雨がほとんど降らない気候で、古代文明のピラミッドがあり、ナイル川が流れる国は？',a:'エジプト',w:['南アフリカ共和国','インド','ブラジル'],e:'ピラミッド・ナイル川・古代文明ならエジプト。'},
{c:'世界の国',q:'自由の女神、星条旗、ハリウッドなどを手がかりにする国は？',a:'アメリカ',w:['カナダ','イギリス','オーストラリア'],e:'自由の女神と星条旗はアメリカ合衆国。'},
{c:'世界の国',q:'メープルシロップが特産品で、広大な森林が広がり、北部は寒くて雪と氷の世界の国は？',a:'カナダ',w:['ロシア','アメリカ','ノルウェー'],e:'メープルシロップと広大な森林ならカナダ。'},
{c:'世界の国',q:'サッカーが国民的スポーツで、リオのカーニバルが有名、面積は南アメリカ最大の国は？',a:'ブラジル',w:['アルゼンチン','メキシコ','チリ'],e:'リオのカーニバル、サッカー、南米最大はブラジル。'},
{c:'世界の国',q:'タンゴが有名で、アサードという焼いた牛肉料理が伝統料理、首都はブエノスアイレスの国は？',a:'アルゼンチン',w:['ブラジル','ペルー','カナダ'],e:'タンゴとブエノスアイレスが決め手。'},
{c:'世界の国',q:'コアラが生息し、先住民の聖地ウルルがあり、1つの大陸に1つの国がある国は？',a:'オーストラリア',w:['ニュージーランド','カナダ','インドネシア'],e:'コアラ、ウルル、大陸国家はオーストラリア。'},
{c:'世界の姿',q:'地球を南北に分ける基準の線は？',a:'赤道',w:['本初子午線','日付変更線','北回帰線'],e:'赤道は緯度0度。地球を北半球と南半球に分ける。'},
{c:'世界の姿',q:'地球を東西に分ける基準になる経度0度の線は？',a:'本初子午線',w:['赤道','北極線','日付変更線'],e:'経度0度は本初子午線。イギリスのロンドン付近を通る。'},
{c:'世界の姿',q:'赤道より北の地域を何という？',a:'北半球',w:['南半球','東半球','西半球'],e:'赤道を境に北が北半球、南が南半球。'},
{c:'世界の姿',q:'赤道より南の地域を何という？',a:'南半球',w:['北半球','東半球','西半球'],e:'赤道を境に南が南半球。'},
{c:'緯度と経度',q:'緯度とは、赤道を0度として南北を何度ずつに分けたもの？',a:'90度ずつ',w:['180度ずつ','360度ずつ','45度ずつ'],e:'緯度は北緯90度、南緯90度まで。'},
{c:'緯度と経度',q:'経度とは、本初子午線を0度として東西を何度ずつに分けたもの？',a:'180度ずつ',w:['90度ずつ','60度ずつ','360度ずつ'],e:'経度は東経180度、西経180度まで。'},
{c:'緯度と経度',q:'緯度0度の線は？',a:'赤道',w:['本初子午線','日付変更線','標準時子午線'],e:'緯度0度は赤道。'},
{c:'緯度と経度',q:'経度0度の線は？',a:'本初子午線',w:['赤道','北緯線','南回帰線'],e:'経度0度は本初子午線。'},
{c:'緯度と経度',q:'同じ緯度を結んだ線を何という？',a:'緯線',w:['経線','赤道','子午線'],e:'同じ緯度の地点を結ぶ横方向の線が緯線。'},
{c:'緯度と経度',q:'同じ経度を結んだ線を何という？',a:'経線',w:['緯線','赤道','等高線'],e:'同じ経度の地点を結ぶ線が経線。'},
{c:'緯度と経度',q:'赤道より北の緯度は何と表す？',a:'北緯',w:['南緯','東経','西経'],e:'赤道より北は北緯。'},
{c:'緯度と経度',q:'赤道より南の緯度は何と表す？',a:'南緯',w:['北緯','東経','西経'],e:'赤道より南は南緯。'},
{c:'緯度と経度',q:'本初子午線より東の経度は何と表す？',a:'東経',w:['西経','北緯','南緯'],e:'本初子午線より東は東経。'},
{c:'緯度と経度',q:'本初子午線より西の経度は何と表す？',a:'西経',w:['東経','北緯','南緯'],e:'本初子午線より西は西経。'},
{c:'世界地図',q:'地球の姿を最も正確に表しているものは？',a:'地球儀',w:['メルカトル図法の地図','正距方位図法の地図','道路地図'],e:'地球は球体なので、形・面積・距離などを最も正確に表せるのは地球儀。'},
{c:'世界地図',q:'平面の世界地図で、地球の姿をすべて正確に表すことができない理由は？',a:'地球が球体だから',w:['国が多すぎるから','海が広いから','地図が小さいから'],e:'球体を平面に広げると、形・面積・距離・方位のどれかにゆがみが出る。'},
{c:'世界地図',q:'緯線と経線が直角に交わり、高緯度ほど面積が大きく見える地図は？',a:'メルカトル図法',w:['地球儀','正距方位図法','統計地図'],e:'メルカトル図法は航海などに便利だが、高緯度の面積が大きく見える。'},
{c:'世界地図',q:'中心からの距離と方位が正しく表される地図は？',a:'正距方位図法',w:['メルカトル図法','モルワイデ図法','地形図'],e:'東京からの最短コースや距離を見る問題でよく使う地図。'},
{c:'世界地図',q:'世界地図でよくある「赤道から離れるほど面積が大きく見える」特徴は、どの図法に関係する？',a:'メルカトル図法',w:['地球儀','正距方位図法','鳥瞰図'],e:'メルカトル図法ではグリーンランドなど高緯度地域が実際より大きく見える。'},
{c:'大陸と海洋',q:'世界最大の大陸は？',a:'ユーラシア大陸',w:['アフリカ大陸','北アメリカ大陸','オーストラリア大陸'],e:'アジアとヨーロッパを合わせたユーラシア大陸が最大。'},
{c:'大陸と海洋',q:'世界最大の海洋は？',a:'太平洋',w:['大西洋','インド洋','北極海'],e:'三大洋の中で最大は太平洋。'},
{c:'大陸と海洋',q:'ユーラシア大陸の南に広がる大洋は？',a:'インド洋',w:['太平洋','大西洋','北極海'],e:'インド洋はインド半島の南側に広がる。'},
{c:'大陸と海洋',q:'南極点を中心に広がる大陸は？',a:'南極大陸',w:['オーストラリア大陸','アフリカ大陸','南アメリカ大陸'],e:'南極大陸は南極点を含む。'},
{c:'大陸と海洋',q:'赤道が通っている大陸として正しいものは？',a:'アフリカ大陸',w:['南極大陸','ヨーロッパ大陸','オーストラリア大陸'],e:'赤道はアフリカ大陸などを通る。'},
{c:'大陸と海洋',q:'日本が位置する大陸の東側にある大洋は？',a:'太平洋',w:['大西洋','インド洋','北極海'],e:'日本の東側には太平洋が広がる。'},
{c:'統計',q:'表の中で、日本より面積が大きく、約20倍の面積をもつ国として出ていた国は？',a:'オーストラリア',w:['ドイツ','シンガポール','ニュージーランド'],e:'ワークの表では日本38万㎢、オーストラリア769万㎢で約20倍。'},
{c:'統計',q:'ワークの表で、日本と最も面積が近い国は？',a:'ドイツ',w:['ロシア','カナダ','シンガポール'],e:'日本38万㎢、ドイツ36万㎢で近い。'},
{c:'統計',q:'日本の国土面積はおよそ何万平方キロメートル？',a:'約38万㎢',w:['約3.8万㎢','約380万㎢','約760万㎢'],e:'日本の面積は約38万平方キロメートル。'},
{c:'日本の位置',q:'日本はどの大陸の東に位置する？',a:'ユーラシア大陸',w:['北アメリカ大陸','アフリカ大陸','オーストラリア大陸'],e:'日本はユーラシア大陸の東、太平洋の西側にある。'},
{c:'日本の位置',q:'日本の東側に広がる大洋は？',a:'太平洋',w:['大西洋','インド洋','北極海'],e:'日本の東は太平洋。'},
{c:'日本の位置',q:'日本のおおよその緯度の範囲は？',a:'北緯20〜46度',w:['南緯20〜46度','北緯60〜80度','北緯0〜10度'],e:'ワークでは日本はおよそ北緯20〜46度。'},
{c:'日本の位置',q:'日本のおおよその経度の範囲は？',a:'東経122〜154度',w:['西経122〜154度','東経20〜46度','西経20〜46度'],e:'ワークでは日本はおよそ東経122〜154度。'},
{c:'日本の位置',q:'日本の標準時子午線は東経何度？',a:'東経135度',w:['東経120度','東経150度','西経135度'],e:'日本標準時子午線は東経135度。兵庫県明石市付近を通る。'},
{c:'日本の位置',q:'日本は国土の周囲を何に囲まれている？',a:'海',w:['砂漠','山脈','氷河'],e:'日本は海に囲まれた島国。'},
{c:'日本の位置',q:'日本列島の形の特徴として正しいものは？',a:'南北に長い',w:['東西だけに長い','赤道上にある','大陸の内部にある'],e:'日本は北海道から沖縄まで南北に長い。'},
{c:'日本の位置',q:'日本とほぼ同じ緯度にある都市としてワークに出ていたものは？',a:'ニューヨーク',w:['ロンドン','カイロ','サンフランシスコ'],e:'日本はアメリカのニューヨーク付近と同じくらいの緯度にある。'},
{c:'日本の位置',q:'日本とほぼ同じ緯度にあるヨーロッパの都市として出ていたものは？',a:'ローマ',w:['ロンドン','モスクワ','ヘルシンキ'],e:'ローマは日本と近い緯度として扱われる。'},
{c:'日本の領域',q:'1つの国の範囲を表す言葉は？',a:'領域',w:['領土','領海','排他的経済水域'],e:'領域は領土・領海・領空を合わせた国の範囲。'},
{c:'日本の領域',q:'陸地の部分を指す国の範囲は？',a:'領土',w:['領海','領空','公海'],e:'領土は国の陸地部分。'},
{c:'日本の領域',q:'海岸線から12海里までの海は？',a:'領海',w:['領空','排他的経済水域','公海'],e:'領海は沿岸から12海里まで。'},

const STORAGE='social4quiz_v2';
const STATS='social4quiz_stats_v2';
let extra=JSON.parse(localStorage.getItem(STORAGE)||'[]');
let questions=[...BASE_QUESTIONS,...extra];
let stats=JSON.parse(localStorage.getItem(STATS)||'{}');
let order=[],idx=0,current=null,answered=false,reviewOnly=false;
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function saveStats(){localStorage.setItem(STATS,JSON.stringify(stats))}
function qid(q){return q.c+'|'+q.q}
function ensureStat(q){let id=qid(q); if(!stats[id]) stats[id]={seen:0,ok:0,ng:0}; return stats[id]}
function cats(){return ['全カテゴリ',...Array.from(new Set(questions.map(x=>x.c))).sort()]}
function fillCats(){let sel=$('category');let old=sel.value;sel.innerHTML=cats().map(c=>`<option>${c}</option>`).join(''); if([...sel.options].some(o=>o.value===old)) sel.value=old}
function buildOrder(){let cat=$('category').value||'全カテゴリ'; let pool=questions.filter(q=>cat==='全カテゴリ'||q.c===cat); if(reviewOnly) pool=pool.filter(q=>ensureStat(q).ng>0); let mode=$('mode').value; if(mode==='new') pool.sort((a,b)=>ensureStat(a).seen-ensureStat(b).seen||Math.random()-.5); else if(mode==='weak') pool.sort((a,b)=>(ensureStat(b).ng-ensureStat(b).ok)-(ensureStat(a).ng-ensureStat(a).ok)||Math.random()-.5); else pool=shuffle(pool); order=pool; idx=0; if(order.length===0){reviewOnly=false; order=shuffle(questions.filter(q=>cat==='全カテゴリ'||q.c===cat));} }
function updateStats(){let all=Object.values(stats);let seen=all.reduce((s,x)=>s+x.seen,0),ok=all.reduce((s,x)=>s+x.ok,0);$('seen').textContent=seen;$('ok').textContent=ok;$('rate').textContent=seen?Math.round(ok/seen*100)+'%':'0%'; let misses=questions.filter(q=>ensureStat(q).ng>0).sort((a,b)=>ensureStat(b).ng-ensureStat(a).ng).slice(0,30); $('missList').innerHTML=misses.length?misses.map(q=>`<div class="miss"><b>${q.c}</b><br>${q.q}<br><span class="ngTxt">×${ensureStat(q).ng}</span> / <span class="okTxt">○${ensureStat(q).ok}</span></div>`).join(''):'<div class="mini">まだ間違いなし。えらい。</div>'}
function showQ(){if(order.length===0) buildOrder(); if(idx>=order.length){buildOrder()} current=order[idx]; answered=false; $('cat').textContent=current.c; $('progress').textContent=`Q ${idx+1} / ${order.length}（全${questions.length}問）`; $('bar').style.width=((idx)/Math.max(1,order.length)*100)+'%'; $('question').textContent=current.q; $('explain').className='explain'; $('explain').innerHTML=''; let opts=shuffle([current.a,...current.w]); $('choices').innerHTML=opts.map(o=>`<button class="choice">${o}</button>`).join(''); [...document.querySelectorAll('.choice')].forEach(b=>b.onclick=()=>answer(b)); $('main').classList.remove('flash'); void $('main').offsetWidth; $('main').classList.add('flash')}
function answer(btn){if(answered)return; answered=true; let s=ensureStat(current); s.seen++; let correct=btn.textContent===current.a; if(correct){s.ok++; btn.classList.add('correct')} else {s.ng++; btn.classList.add('wrong'); [...document.querySelectorAll('.choice')].find(b=>b.textContent===current.a)?.classList.add('correct')} [...document.querySelectorAll('.choice')].forEach(b=>b.disabled=true); $('explain').className='explain show'; $('explain').innerHTML=`<div class="bigResult ${correct?'okTxt':'ngTxt'}">${correct?'正解！':'違う！ 正解は「'+current.a+'」'}</div><div>${current.e||''}</div>`; saveStats(); updateStats()}
function next(){idx++; showQ()}
$('nextBtn').onclick=next;
$('reviewBtn').onclick=()=>{reviewOnly=true; buildOrder(); showQ()};
$('resetBtn').onclick=()=>{if(confirm('成績を全部リセットする？')){stats={};saveStats();updateStats();showQ()}};
$('mode').onchange=()=>{reviewOnly=false;buildOrder();showQ()};

$('addBtn').onclick=()=>{let q=$('newQ').value.trim(),a=$('newA').value.trim(),w=$('newW').value.split(',').map(x=>x.trim()).filter(Boolean),c=$('newC').value.trim()||'追加問題',e=$('newE').value.trim(); if(!q||!a||w.length!==3){alert('問題、正解、誤答3つを入れて');return} extra.push({c,q,a,w,e}); localStorage.setItem(STORAGE,JSON.stringify(extra)); questions=[...BASE_QUESTIONS,...extra]; fillCats(); buildOrder(); showQ(); alert('追加した！')};
