name: Build Pokemon Info Textures

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_pokemon_info_textures.py'
      - '.github/workflows/build-pokemon-info-textures.yml'

permissions:
  contents: write

concurrency:
  group: build-pokemon-info-textures
  cancel-in-progress: true

jobs:
  build-pokemon-info-textures:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Generate all 151 Pokemon info textures
        run: python tools/build_pokemon_info_textures.py

      - name: Commit generated 151 files
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pokemon-gen1-icons/ generated/pokemon-info-textures.gen1.30x30.generated.js generated/pokemon-info-textures.gen1.30x30.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Generate all 151 Pokemon info textures"
            git push
          fi
