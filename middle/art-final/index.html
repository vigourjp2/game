<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>中1 美術・期末テスト</title><link rel="stylesheet" href="./style.css"><script src="../../score-user-fixed.js"></script><script src="../../firebase-config.js"></script><script src="./questions.js"></script></head><body>
<div class="flash" id="flash"></div><div class="app"><header class="top"><div><div class="title">🎨 中1 美術・期末テスト</div><div class="sub">今回送られた5資料だけ。全70問・全問挿し絵付き。</div><div class="pills"><span class="pill">本番50問＝100点</span><span class="pill">5領域</span><span class="pill">Firebase最高点</span></div></div><a class="nav" href="../../">🏠 TOP</a></header>
<section id="home" class="screen active"><div class="homeGrid"><div class="card"><h2>期末対策メニュー</h2><p class="sub">技法／構成／文字／和文様／世界の模様。画像を見て答える力まで仕上げる。</p><div class="modes"><button class="mode primary" onclick="startFinal()"><b>🏆 本番50問</b><span>5領域×10問、1問2点。100点満点。</span></button><button class="mode" onclick="startAll()"><b>🔥 全70問</b><span>今回の範囲を全部通す。</span></button><button class="mode" onclick="startWeak()"><b>🩹 間違いだけ</b><span>ミスだけ再出題。</span></button><button class="mode" onclick="gallery()"><b>🖼️ 図解ギャラリー</b><span>5領域を絵で復習。</span></button></div><div class="cats" id="cats"></div></div><div class="hero" id="hero"></div></div></section>
<section id="quiz" class="screen"><div class="quizGrid"><main class="card"><div class="qhead"><div><span class="tag" id="cat"></span> <span class="tag" id="mode"></span></div><b id="num"></b></div><div class="progress"><div class="bar" id="bar"></div></div><div class="visual" id="visual"></div><div class="q" id="q"></div><div class="choices" id="choices"></div><div class="feedback" id="fb"></div><div class="actions"><button class="btn" id="next" onclick="next()" style="display:none">次へ ▶</button><button class="btn" onclick="home()">中断</button></div></main><aside class="card side"><h3>現在の成績</h3><div class="stats"><div class="stat"><b id="ok">0</b>正解</div><div class="stat"><b id="done">0</b>回答</div><div class="stat"><b id="rate">0%</b>正答率</div><div class="stat"><b id="weakN">0</b>弱点</div></div><h4>今回の間違い</h4><div id="weakList"></div></aside></div></section>
<section id="result" class="screen"><div class="card center"><div class="sub" id="resultMode"></div><div class="score" id="score"></div><h2 id="grade"></h2><p class="sub" id="summary"></p><div class="breaks" id="breaks"></div><div class="actions" style="justify-content:center"><button class="btn" onclick="startFinal()">本番をもう一度</button><button class="btn" onclick="startWeak()">間違いだけ</button><button class="btn" onclick="home()">メニュー</button></div></div></section>
<section id="gallery" class="screen"><div class="qhead"><div><h2>🖼️ 5領域 図解ギャラリー</h2><div class="sub">送付資料の範囲を、公開用のオリジナル図解に整理。</div></div><button class="nav" onclick="home()">← 戻る</button></div><div class="gallery" id="boards"></div></section></div><script src="./app.js"></script></body></html>
