<header class="hero"><div class="topline"><a class="back" href="../../">← TOPメニュー</a><div class="badge">GitHub Pages対応 / index.html 1ファイル</div></div><h1>中1 数学 前期中間<br>正負の数 模擬テスト</h1><p class="lead">添付プリントの問題型を中心に、数字違い・符号違い・ひっかけ選択肢を増量。全部4択。</p><div class="badges"><span class="badge">📐 正負の数</span><span class="badge">➕ 加減乗除</span><span class="badge">⚠️ 符号ひっかけ</span><span class="badge">📝 50問100点モード</span></div></header>

<script>
const QUESTIONS = [{"cat": "正負の数", "q": "0より8小さい数を、正負の符号をつけて表すと？", "a": "-8", "choices": ["0.8", "+8", "-8", "8"], "ex": "0より小さいので負の数。"}, {"cat": "正負の数", "q": "0より15大きい数を、正負の符号をつけて表すと？", "a": "+15", "choices": ["-15", "15だけ小さい", "0.15", "+15"], "ex": "0より大きいので正の数。"}, {"cat": "正負の数", "q": "「6個少ない」を、反対の意味のことばを使って表すと？", "a": "−6個多い", "choices": ["+6個多い", "−6個多い", "−6個少ない", "6個多い"], "ex": "少ないを多いで表すと符号が逆。"}, {"cat": "正負の数", "q": "「50円たりない」を、反対の意味のことばを使って表すと？", "a": "−50円余る", "choices": ["−50円たりない", "50円たりない", "−50円余る", "+50円余る"], "ex": "たりないを余るで表すと負。"}, {"cat": "正負の数", "q": "−3の絶対値はいくつ？", "a": "3", "choices": ["0", "3", "−3", "1/3"], "ex": "絶対値は0からの距離。"}, {"cat": "整数・自然数", "q": "−0.2, +5, 1/3, 0, −7, 10, 1.5 の中で、整数だけをすべて選ぶと？", "a": "+5, 0, −7, 10", "choices": ["0, 10", "−0.2, 1/3, 1.5", "+5, 0, −7, 10", "+5, −7, 10"], "ex": "小数・分数は整数ではない。"}, {"cat": "整数・自然数", "q": "−0.2, +5, 1/3, 0, −7, 10, 1.5 の中で、自然数だけをすべて選ぶと？", "a": "+5, 10", "choices": ["0, +5, 10", "+5, 1/3, 10", "−7, +5, 10", "+5, 10"], "ex": "中1では自然数は正の整数。0は含めない。"}, {"cat": "数直線", "q": "数直線で −2.5 の点はどれ？（A=−2.5, B=−0.5, C=5）", "a": "A", "choices": ["−1", "A", "C", "B"], "ex": "−2.5は−3と−2の間。"}, {"cat": "数直線", "q": "数直線で −0.5 の点はどれ？（A=−2.5, B=−0.5, C=5）", "a": "B", "choices": ["A", "C", "B", "0.5"], "ex": "−0.5は0の左に0.5。"}, {"cat": "数直線", "q": "数直線で 5 の点はどれ？（A=−2.5, B=−0.5, C=5）", "a": "C", "choices": ["A", "−5", "B", "C"], "ex": "正の数は0の右。"}, {"cat": "数直線", "q": "1/2 を小数で表すと？", "a": "0.5", "choices": ["1.2", "0.5", "−0.5", "2"], "ex": "1÷2=0.5。"}, {"cat": "大小比較", "q": "4 と −6 の大小を不等号で表すと？", "a": "4＞−6", "choices": ["−4＞6", "4＜−6", "4＝−6", "4＞−6"], "ex": "正の数は負の数より大きい。"}, {"cat": "大小比較", "q": "−7 と −8 の大小を不等号で表すと？", "a": "−7＞−8", "choices": ["−8＞−7", "7＞8", "−7＞−8", "−7＜−8"], "ex": "負の数は0に近いほうが大きい。"}, {"cat": "大小比較", "q": "−0.1 と 0 の大小を不等号で表すと？", "a": "−0.1＜0", "choices": ["−0.1＞0", "0＜−0.1", "−0.1＜0", "−0.1＝0"], "ex": "負の数は0より小さい。"}, {"cat": "加法・減法", "q": "次の計算をしなさい：(−3)+(−7)", "a": "-10", "choices": ["10", "-11", "-4", "-10"], "ex": "符号・計算順序に注意。"}, {"cat": "加法・減法", "q": "次の計算をしなさい：(−1.7)+(+0.3)", "a": "-1.4", "choices": ["-1.4", "−2.0", "1.4", "−1.0"], "ex": "符号・計算順序に注意。"}, {"cat": "加法・減法", "q": "次の計算をしなさい：(−1/2)+(−1/7)", "a": "−9/14", "choices": ["−9/14", "−1/14", "−2/9", "9/14"], "ex": "符号・計算順序に注意。"}, {"cat": "加法・減法", "q": "次の計算をしなさい：(+5)−(+9)", "a": "-4", "choices": ["14", "-4", "4", "-14"], "ex": "符号・計算順序に注意。"}, {"cat": "加法・減法", "q": "次の計算をしなさい：(−2.2)−(−3.1)", "a": "0.9", "choices": ["1.1", "0.9", "−0.9", "−5.3"], "ex": "符号・計算順序に注意。"}, {"cat": "加法・減法", "q": "次の計算をしなさい：(+2/3)−(−3/4)", "a": "17/12", "choices": ["5/12", "−1/12", "−17/12", "17/12"], "ex": "符号・計算順序に注意。"}, {"cat": "加法・減法", "q": "次の計算をしなさい：−5+2", "a": "-3", "choices": ["-3", "15", "3", "-15"], "ex": "符号・計算順序に注意。"}, {"cat": "加法・減法", "q": "次の計算をしなさい：−7−2", "a": "-9", "choices": ["-5", "-9", "-14", "9"], "ex": "符号・計算順序に注意。"}, {"cat": "加法・減法", "q": "次の計算をしなさい：−9−6+2", "a": "-13", "choices": ["-1", "-17", "13", "-13"], "ex": "符号・計算順序に注意。"}, {"cat": "加法・減法", "q": "次の計算をしなさい：27+25+(−27)+(−24)", "a": "1", "choices": ["-1", "1", "0", "79"], "ex": "符号・計算順序に注意。"}, {"cat": "乗法・除法", "q": "次の計算をしなさい：3×(−2)", "a": "-6", "choices": ["-1", "-6", "6", "-5"], "ex": "符号・計算順序に注意。"}, {"cat": "乗法・除法", "q": "次の計算をしなさい：(−8)÷(−2)", "a": "4", "choices": ["1", "-4", "16", "4"], "ex": "符号・計算順序に注意。"}, {"cat": "乗法・除法", "q": "次の計算をしなさい：(−1.6)×(−0.2)", "a": "0.32", "choices": ["0.32", "−0.32", "0.032", "3.2"], "ex": "符号・計算順序に注意。"}, {"cat": "乗法・除法", "q": "次の計算をしなさい：4.5÷(−0.3)", "a": "-15", "choices": ["-15", "15", "-1.5", "-13.5"], "ex": "符号・計算順序に注意。"}, {"cat": "乗法・除法", "q": "次の計算をしなさい：(−21/10)×(5/7)", "a": "−3/2", "choices": ["−15/7", "3/2", "−21/14", "−3/2"], "ex": "符号・計算順序に注意。"}, {"cat": "乗法・除法", "q": "次の計算をしなさい：(−4/9)÷(−4/3)", "a": "1/3", "choices": ["−1/3", "1/3", "3", "4/27"], "ex": "符号・計算順序に注意。"}, {"cat": "四則混合", "q": "次の計算をしなさい：(−2)×6×5", "a": "-60", "choices": ["-30", "60", "-13", "-60"], "ex": "符号・計算順序に注意。"}, {"cat": "四則混合", "q": "次の計算を let mode='exam', activeCat='全て', pool=[], idx=0, ok=0, ng=0, locked=false, wrongs=[];

function makePool(){let base=activeCat==='全て'?QUESTIONS:QUESTIONS.filter(q=>q.cat===activeCat); if(mode==='weak') base=wrongs.length?wrongs:base.filter(q=>false); base=shuffle([...base]); if(mode==='exam') base=base.slice(0, Math.min(50, base.length)); return base;}
function start(){pool=makePool(); idx=0; ok=0; ng=0; locked=false; wrongs=[]; $('summary').classList.remove('show'); $('play').style.display='block'; if(pool.length===0){$('question').textContent='復習する間違いがまだない。まず本番モードをやれ。';$('choices').innerHTML='';$('totalN').textContent=0;return;} show();}

    if(!firebaseConfigured()){firebaseState='Firebase未設定・端末保存';return null;}
    try{
      const [{initializeApp,getApps},{getDatabase,ref,get,set,remove,onValue,serverTimestamp}]=await Promise.all([
        import('https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js')
      ]);
      const app=getApps().length?getApps()[0]:initializeApp(window.GAKUSHU_FIREBASE_CONFIG);
      const db=getDatabase(app);
      fbCache={db,ref,get,set,remove,onValue,serverTimestamp};
      firebaseState='Firebase DB同期ON';
      return fbCache;
    }catch(e){console.warn('Firebase init failed',e);firebaseState='Firebase接続失敗・端末保存';return null;}
  }
  function pathFor(){return 'scoreUsers/'+getUserId()+'/subjects/'+META.id}
  function readBest(){const v=localStorage.getItem(KEY); return v==null?null:Number(v)}
  async function readRemoteBest(){
    const f=await fb(); if(!f) return null;
    try{const snap=await f.get(f.ref(f.db,pathFor())); const v=snap.exists()?snap.val():null; return v&&typeof v.best==='number'?v.best:null}catch(e){console.warn(e);return null}
  }
  async function writeRemoteBest(score){
    const f=await fb(); if(!f) return;
    try{
      const p=f.ref(f.db,pathFor());
      const snap=await f.get(p); const old=snap.exists()?snap.val():null; const oldBest=old&&typeof old.best==='number'?old.best:null;
      if(oldBest==null || score>oldBest){
        await f.set(p,{best:score,subjectName:META.name,subjectId:META.id,updatedAt:f.serverTimestamp(),lastScore:score,scoreUserId:getUserId()});
        firebaseState='Firebase DB同期済';
      }else{
        // 最高点更新なしでも最終点だけ持つ
        await f.set(p,{...(old||{}),best:oldBest,subjectName:META.name,subjectId:META.id,updatedAt:f.serverTimestamp(),lastScore:score,scoreUserId:getUserId()});
        firebaseState='Firebase DB同期済';
      }
      updatePanel();
    }catch(e){console.warn('Firebase write failed',e);firebaseState='Firebase書込失敗・端末保存';updatePanel();}
  }
  async function removeRemoteBest(){const f=await fb(); if(!f)return; try{await f.remove(f.ref(f.db,pathFor())); firebaseState='Firebase DBリセット済';}catch(e){console.warn(e);firebaseState='Firebaseリセット失敗';}}
  async function syncFromRemote(){
    const rb=await readRemoteBest();
    if(rb!=null){const lb=readBest(); if(lb==null||rb>lb)localStorage.setItem(KEY,String(rb));}
    updatePanel();
  }
  async function watchRemote(){
    const f=await fb(); if(!f)return;
    try{f.onValue(f.ref(f.db,pathFor()),snap=>{const v=snap.val(); if(v&&typeof v.best==='number'){const lb=readBest(); if(lb==null||v.best>=lb)localStorage.setItem(KEY,String(v.best));}else{localStorage.removeItem(KEY)} updatePanel();});}catch(e){console.warn(e)}
  }
  function writeBest(score){
    score=Math.max(0,Math.min(100,Math.round(Number(score)||0)));
    const old=readBest();
    localStorage.setItem(LAST, JSON.stringify({score,at:new Date().toISOString(),name:META.name,scoreUserId:getUserId()}));
    if(old==null || score>old){localStorage.setItem(KEY,String(score));}
    updatePanel();
    writeRemoteBest(score);
  }
  window.__recordPeriodicTestScore=function(score){writeBest(score)};
  window.__resetPeriodicTestBest=async function(){if(confirm(META.name+' の歴代最高得点をFirebase DBごとリセットする？')){localStorage.removeItem(KEY);localStorage.removeItem(LAST);await removeRemoteBest();updatePanel();}};
  function ensurePanel(){
    if(!$(STYLE_ID)){
      const st=document.createElement('style');st.id=STYLE_ID;st.textContent=`
      .ptsPanel{position:fixed;right:10px;bottom:10px;z-index:2147483000;background:rgba(15,23,42,.92);color:#fff;border:1px solid rgba(148,163,184,.45);border-radius:16px;padding:10px 12px;box-shadow:0 12px 30px rgba(0,0,0,.35);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:270px}
      .ptsPanel b{display:block;font-size:13px;letter-spacing:.02em}.ptsBest{font-size:18px;font-weight:1000;color:#fde68a;margin-top:2px}.ptsRow{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.ptsRow button{border:0;border-radius:999px;padding:7px 9px;font-weight:900;background:#2563eb;color:white}.ptsRow button.reset{background:#475569}.ptsMini{font-size:11px;color:#cbd5e1;font-weight:800;line-height:1.35;margin-top:4px}.ptsFb{font-size:11px;color:#93c5fd;font-weight:900;margin-top:3px}@media(max-width:560px){.ptsPanel{left:8px;right:8px;bottom:6px;max-width:none;display:flex;align-items:center;justify-content:space-between;gap:8px}.ptsRow{margin-top:0}.ptsMini,.ptsFb{display:none}}`;
      document.head.appendChild(st);
    }
    if($('periodicTestPanel')) return;
    const div=document.createElement('div');div.className='ptsPanel';div.id='periodicTestPanel';div.innerHTML=`<div><b>定期テスト対策テスト</b><div class="ptsBest" id="periodicBest">最高 --点</div><div class="ptsMini">完走点をFirebase DBに歴代最高で保存</div><div class="ptsFb" id="periodicFbState">Firebase確認中</div></div><div class="ptsRow"><button type="button" id="periodicManual">今の点を記録</button><button type="button" class="reset" id="periodicReset">リセット</button></div>`;
    document.body.appendChild(div);
    $('periodicManual').onclick=()=>{const s=extractScore(); if(s==null){alert('まだ点数を検出できない。最後まで解いてから押して。');return} writeBest(s); alert(META.name+'：'+s+'点を記録した。')};
    $('periodicReset').onclick=window.__resetPeriodicTestBest;
    updatePanel();
  }
  function updatePanel(){const b=readBest(); const el=$('periodicBest'); if(el)el.textContent=b==null?'最高 --点':'最高 '+b+'点'; const fbEl=$('periodicFbState'); if(fbEl)fbEl.textContent=firebaseState+' / ID:'+getUserId();}
  function num(s){const n=Number(String(s||'').replace(/[^0-9.]/g,''));return Number.isFinite(n)?n:null}
  function scoreFromOkTotal(ok,total){ok=Number(ok);total=Number(total); if(!total||total<1)return null; return Math.round(ok/total*100)}
  function extractScore(){
    const bodyText=(document.body&&document.body.innerText)||'';
    let best=null;
    const patterns=[/正解\s*([0-9]+)\s*\/\s*([0-9]+)/g,/([0-9]+)問中\s*([0-9]+)問正解/g,/([0-9]+)\s*\/\s*([0-9]+)\s*問/g];
    for(const re of patterns){let m; while((m=re.exec(bodyText))){let a=Number(m[1]),b=Number(m[2]); let sc=null; if(re.source.startsWith('([0-9]+)問中')) sc=scoreFromOkTotal(b,a); else sc=scoreFromOkTotal(a,b); if(sc!=null)best=sc;}}
    let m=bodyText.match(/(?:得点|スコア|点数)[^0-9]{0,8}([0-9]{1,3})\s*点/); if(m)best=Math.max(0,Math.min(100,Number(m[1])));
    m=bodyText.match(/([0-9]{1,3})\s*点相当/); if(m)best=Math.max(0,Math.min(100,Number(m[1])));
    const scoreEl=$('score'); if(scoreEl){const n=num(scoreEl.textContent); if(n!=null&&n>=0&&n<=100)best=Math.round(n)}
    return best;
  }
  function completionSignal(){
    const t=(document.body&&document.body.innerText)||'';
    if(/終了|完了|最後|1周終わり|テスト終了|全問終了/.test(t)) return true;
    const qno=$('qno')?.textContent||''; const m=qno.match(/([0-9]+)\s*\/\s*([0-9]+)/); if(m&&Number(m[1])>=Number(m[2])&&Number(m[2])>0&&/正解\s*[0-9]+\s*\//.test(t))return true;
    return false;
  }
  let recordedAt=0;
  function maybeRecord(){
    if(Date.now()-recordedAt<1500)return;
    if(!completionSignal())return;
    const s=extractScore();
    if(s==null)return;
    recordedAt=Date.now(); writeBest(s);
  }
  const oldAlert=window.alert;
  window.alert=function(msg){try{if(String(msg).match(/1周終わり|終了|完了/)){setTimeout(maybeRecord,50)}}catch(e){} return oldAlert.apply(this,arguments)};
  window.addEventListener('storage',()=>syncFromRemote());
  window.addEventListener('load',()=>{ensurePanel(); syncFromRemote(); watchRemote(); setInterval(maybeRecord,1200); const mo=new MutationObserver(()=>maybeRecord()); mo.observe(document.body,{childList:true,subtree:true,characterData:true});});
})();
</script>
</body></html>
