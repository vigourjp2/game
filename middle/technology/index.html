let queue=[],pos=0,ok=0,answered=false,sessionCat={},sessionWrong=new Set();const WRONG_KEY='middleTechnologyWrong',BEST_KEY='periodicTestBest:'+SUBJECT_ID,$=id=>document.getElementById(id);function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function wrongSet(){try{return new Set(JSON.parse(localStorage.getItem(WRONG_KEY)||'[]'))}catch{return new Set()}}function saveWrong(s){localStorage.setItem(WRONG_KEY,JSON.stringify([...s]))}function screens(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}function showHome(){screens('home');readBest();renderModes();scrollTo(0,0)}function startMode(m){let base;if(m==='final')base=shuffle(Q).slice(0,50);else if(m==='quick')base=shuffle(Q).slice(0,10);else if(m==='wrong'){const w=wrongSet();base=shuffle(Q.filter(q=>w.has(q.id)));if(!base.length){alert('まだ間違い問題がないぞ！');return}}else base=shuffle(Q.filter(q=>q.cat===m));queue=base;pos=0;ok=0;answered=false;sessionCat={};sessionWrong=new Set();screens('quiz');renderQ();scrollTo(0,0)}function renderQ(){if(pos>=queue.length){finish();return}answered=false;const q=queue[pos];$('catTag').textContent=q.cat;$('qNo').textContent=`${pos+1} / ${queue.length}`;$('bar').style.width=(pos/queue.length*100)+'%';$('ill').innerHTML=art(q.ill);$('question').textContent=q.ask;$('feedback').className='feedback';$('feedback').innerHTML='';$('nextBtn').style.display='none';const opts=shuffle([q.answer,...q.wrong]);$('choices').innerHTML=opts.map(x=>`<button class="choice" data-v="${esc(x)}" onclick="answer(this)">${esc(x)}</button>`).join('');updateStats()}function answer(btn){if(answered)return;answered=true;const q=queue[pos],v=btn.dataset.v,good=v===q.answer;sessionCat[q.cat]??={ok:0,total:0};sessionCat[q.cat].total++;const ws=wrongSet();document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.v===q.answer)b.classList.add('correct')});if(good){ok++;sessionCat[q.cat].ok++;ws.delete(q.id);$('feedback').className='feedback show ok';$('feedback').innerHTML=`✅ 正解！ <b>${esc(q.answer)}</b><br>${esc(q.ex)}`}else{btn.classList.add('wrong');ws.add(q.id);sessionWrong.add(q.id);$('feedback').className='feedback show ng';$('feedback').innerHTML=`❌ 正解は <b>${esc(q.answer)}</b><br>${esc(q.ex)}`}saveWrong(ws);$('nextBtn').style.display='inline-block';updateStats()}function nextQuestion(){if(!answered)return;pos++;renderQ();scrollTo(0,0)}function updateStats(){const done=pos+(answered?1:0);$('stDone').textContent=done;$('stOk').textContent=ok;$('stRate').textContent=(done?Math.round(ok/done*100):0)+'%';const ws=wrongSet();$('stWrong').textContent=ws.size;$('wrongList').innerHTML=[...ws].slice(-15).reverse().map(id=>{const q=Q.find(x=>x.id===id);return q?`<div class="wrong"><b>${esc(q.cat)}</b><br>${esc(q.ask)}</div>`:''}).join('')||'<div class="wrong">まだ弱点なし。</div>'}function finish(){const total=queue.length,score=total?Math.round(ok/total*100):0;screens('result');$('resultScore').textContent=score+'点';$('grade').textContent=score>=90?'S：仕上がってる🔥':score>=80?'A：かなり強い':score>=70?'B：あと一段':score>=60?'C：弱点を潰そう':'D：単元練習から';$('resultText').textContent=`${total}問中 ${ok}問正解。今回の間違い ${sessionWrong.size}問。`;$('breakdown').innerHTML=cats.map(c=>{const x=sessionCat[c]||{ok:0,total:0};return `<div class="break">${c}<b>${x.total?Math.round(x.ok/x.total*100):'--'}%</b><br><span class="sub">${x.ok}/${x.total}</span></div>`}).join('');saveBest(score);scrollTo(0,0)}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function fb(){if(!window.GAKUSHU_FIREBASE_CONFIG)return null;try{const[a,d]=await Promise.all([import('https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js'),import('https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js')]);const app=a.getApps().length?a.getApps()[0]:a.initializeApp(window.GAKUSHU_FIREBASE_CONFIG);return{db:d.getDatabase(app),...d}}catch{return null}}async function readBest(){let b=Number(localStorage.getItem(BEST_KEY));if(!Number.isFinite(b))b=null;$('bestScore').textContent=b==null?'--':b;const f=await fb();if(!f)return;try{const s=await f.get(f.ref(f.db,'scoreUsers/gakushu-main/subjects/'+SUBJECT_ID)),v=s.exists()?s.val():null;if(v&&typeof v.best==='number'){b=b==null?v.best:Math.max(b,v.best);localStorage.setItem(BEST_KEY,String(b));$('bestScore').textContent=b}}catch{}}async function saveBest(score){let old=Number(localStorage.getItem(BEST_KEY));if(!Number.isFinite(old)||score>old){old=score;localStorage.setItem(BEST_KEY,String(score))}$('bestScore').textContent=old;const f=await fb();if(!f)return;try{const p=f.ref(f.db,'scoreUsers/gakushu-main/subjects/'+SUBJECT_ID),s=await f.get(p),v=s.exists()?s.val():null,b=v&&typeof v.best==='number'?Math.max(v.best,score):score;await f.set(p,{...(v||{}),best:b,lastScore:score,subjectId:SUBJECT_ID,subjectName:SUBJECT_NAME,scoreUserId:'gakushu-main',updatedAt:f.serverTimestamp()})}catch{}}renderModes();readBest();
