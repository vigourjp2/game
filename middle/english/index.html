<div class="app">

      </div>
      <div class="homeGrid" id="modeGrid"></div>
    </div>

  </div>

    <div class="grid">

        <div class="progress"><div class="bar" id="bar"></div></div>
        <div class="question" id="question"></div>
        <div class="sub" id="hint"></div>
        <div class="speakrow"><button class="btn small" onclick="speakCurrent()">🔊 もう一回聞く</button><button class="btn small ghost" onclick="skipQuestion()">スキップ</button></div>
        <div class="choices" id="choices"></div>
        <div class="result" id="result"></div>
        <div class="panel" style="margin-top:12px"><button class="btn primary" id="nextBtn" onclick="nextQuestion()" style="display:none">次へ ▶</button><button class="btn warn" onclick="startWrongOnly()">間違いだけ復習</button></div>

      <aside class="card">
        <div class="big">成績</div>
        <div class="stats"><div class="stat"><b id="stTotal">0</b>出題</div><div class="stat"><b id="stOk">0</b>正解</div><div class="stat"><b id="stRate">0%</b>正答率</div><div class="stat"><b id="stWrong">0</b>弱点</div></div>
        <div class="panel" style="margin-bottom:10px"><select class="select" id="categoryFilter" onchange="reloadMode()"></select><button class="btn small" onclick="shuffleQueue()">シャッフル</button></div>
        <div class="sub">弱点リスト</div><div class="list" id="wrongList"></div>
      </aside>
    </div>
  </div>
</div>

let mode='all', queue=[], idx=0, current=null, locked=false;
let stats = JSON.parse(localStorage.getItem('engQuizStats')||'{"total":0,"ok":0,"wrong":{}}');
function save(){localStorage.setItem('engQuizStats',JSON.stringify(stats));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffledChoices(q){const arr=q.choices.map((c,i)=>({c,i})); shuffle(arr); return arr;}
function categories(){return ['全部',...Array.from(new Set(QUESTIONS.map(q=>q.cat)))];}
function init(){
 const modes=[['all','全部シャッフル','Unit1〜Unit2を全部まぜる。'],['vocab','語句だけ','画像右ページの語句確認を4択。'],['grammar','文法・並べ替え','I\'m / like / can / Are you / Do you を確認。'],['wrong','間違いだけ','弱点だけを再出題。']];
 const grid=document.getElementById('modeGrid'); grid.innerHTML='';
 modes.forEach(m=>{const d=document.createElement('div');d.className='mode';d.onclick=()=>startMode(m[0]);d.innerHTML=`<h3>${m[1]}</h3><p>${m[2]}</p>`;grid.appendChild(d)});
 const sel=document.getElementById('categoryFilter'); sel.innerHTML=''; categories().forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o)}); updateStats();
}
function showHome(){document.getElementById('home').classList.add('active');document.getElementById('quiz').classList.remove('active');}
function showQuiz(){document.getElementById('home').classList.remove('active');document.getElementById('quiz').classList.add('active');}
function startMode(m){mode=m; if(m==='wrong') return startWrongOnly(); buildQueue(); showQuiz(); render();}
function buildQueue(){let list=[...QUESTIONS]; const cf=document.getElementById('categoryFilter').value; if(cf&&cf!=='全部') list=list.filter(q=>q.cat===cf); if(mode==='vocab') list=list.filter(q=>q.type.includes('語句')); if(mode==='grammar') list=list.filter(q=>!q.type.includes('語句')); queue=shuffle(list.map(q=>QUESTIONS.indexOf(q))); idx=0;}
function reloadMode(){buildQueue(); render();}
function shuffleQueue(){queue=shuffle(queue); idx=0; render();}
function startWrongOnly(){const ids=Object.keys(stats.wrong||{}).map(Number).filter(i=>QUESTIONS[i]); if(!ids.length){alert('まだ弱点なし。まず通常問題やれ‼️');return} queue=shuffle(ids); idx=0; mode='wrong'; showQuiz(); render();}
function render(){ if(!queue.length){document.getElementById('question').textContent='問題がない‼️';return} locked=false; current=QUESTIONS[queue[idx%queue.length]]; current._id=queue[idx%queue.length]; current._mix=shuffledChoices(current); document.getElementById('catTag').textContent=current.cat; document.getElementById('typeTag').textContent=current.type; document.getElementById('qNo').textContent=`${idx+1} / ${queue.length}`; document.getElementById('bar').style.width=`${Math.round((idx)/queue.length*100)}%`; document.getElementById('question').innerHTML=escapeHtml(current.ask); document.getElementById('hint').innerHTML=current.ex?`ヒント：${escapeHtml(current.ex)}`:'4択から選べ。英語は音で覚えろ。'; const cbox=document.getElementById('choices'); cbox.innerHTML=''; current._mix.forEach((o,n)=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<span><span class="letter">${'ABCD'[n]}</span> ${escapeHtml(o.c)}</span><span>›</span>`;b.onclick=()=>answer(o.i,b);cbox.appendChild(b)}); document.getElementById('result').className='result'; document.getElementById('result').style.display='none'; document.getElementById('nextBtn').style.display='none'; if(document.getElementById('autoSpeak').checked) setTimeout(()=>speakCurrent(),250); updateStats();}
function answer(choiceIdx,btn){ if(locked)return; locked=true; const ok=choiceIdx===current.ans; stats.total++; if(ok){stats.ok++; delete stats.wrong[current._id];}else{stats.wrong[current._id]=(stats.wrong[current._id]||0)+1; document.getElementById('quizCard').classList.add('shake'); setTimeout(()=>document.getElementById('quizCard').classList.remove('shake'),280);} save(); [...document.querySelectorAll('.choice')].forEach(b=>b.disabled=true); [...document.querySelectorAll('.choice')].forEach((b,i)=>{const oi=current._mix[i].i;if(oi===current.ans)b.classList.add('correct'); if(b===btn&&!ok)b.classList.add('wrong')}); const res=document.getElementById('result'); res.style.display='block'; res.className='result '+(ok?'ok':'ng'); const correct=current.choices[current.ans]; res.innerHTML= ok?`✅ 正解！<div class="typing">${escapeHtml(correct)}</div>`:`❌ 違う。正解は <div class="typing">${escapeHtml(correct)}</div>`; document.getElementById('nextBtn').style.display='inline-block'; if(document.getElementById('speakAnswer').checked) speak(correct); updateStats();}
function nextQuestion(){idx++; if(idx>=queue.length){document.getElementById('bar').style.width='100%'; idx=0; queue=shuffle(queue); alert('1周終わり。もう1周シャッフルするぞ‼️');} render();}
function skipQuestion(){idx=(idx+1)%queue.length; render();}
function speakCurrent(){ if(!current)return; speak(current.speak||current.choices[current.ans]);}
function speak(text){ try{ if(!('speechSynthesis' in window)) return alert('このブラウザは音声読み上げ非対応っぽい'); window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=.86; u.pitch=1.0; const voices=window.speechSynthesis.getVoices(); const v=voices.find(v=>/en[-_]US/i.test(v.lang)&&/Google|Microsoft|Samantha|English/i.test(v.name))||voices.find(v=>/^en/i.test(v.lang)); if(v)u.voice=v; window.speechSynthesis.speak(u);}catch(e){console.log(e)} }
function updateStats(){document.getElementById('stTotal').textContent=stats.total||0;document.getElementById('stOk').textContent=stats.ok||0;document.getElementById('stRate').textContent=stats.total?Math.round(stats.ok/stats.total*100)+'%':'0%';const wrongIds=Object.keys(stats.wrong||{}).filter(i=>QUESTIONS[i]);document.getElementById('stWrong').textContent=wrongIds.length;const wl=document.getElementById('wrongList'); if(!wl)return; wl.innerHTML=wrongIds.length?'':'<div class="mini">弱点なし。今だけは褒めたる。</div>'; wrongIds.sort((a,b)=>stats.wrong[b]-stats.wrong[a]).forEach(id=>{const q=QUESTIONS[id]; const d=document.createElement('div');d.className='mini';d.innerHTML=`<b>${escapeHtml(q.cat)}</b> ×${stats.wrong[id]}<br>${escapeHtml(q.ask)}<br><span class="typing">${escapeHtml(q.choices[q.ans])}</span>`;wl.appendChild(d)})}
function resetStats(){if(confirm('成績と弱点を消す？')){stats={total:0,ok:0,wrong:{}};save();updateStats();}}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
window.speechSynthesis&&window.speechSynthesis.getVoices(); init();
</script>

<script src="../../firebase-config.js"></script>
<script id="periodic-test-score-addon">
(function(){
  const META={id:"middle-english",name:"中学 英語"};
  const KEY='periodicTestBest:'+META.id;
  const LAST='periodicTestLast:'+META.id;
  const STYLE_ID='periodic-test-style';
  const USER_KEY='gakushuScoreUserId';
  let firebaseState='確認中';
  let fbCache=null;
  function $(id){return document.getElementById(id)}
  function safeId(s){return String(s||'default').replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,80)||'default'}
  function getUserId(){
    let id=localStorage.getItem(USER_KEY);
    if(!id){id='guest-'+(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2));localStorage.setItem(USER_KEY,id)}
    return safeId(id);
  }
  function firebaseConfigured(){
    const c=window.GAKUSHU_FIREBASE_CONFIG;
    return !!(c && c.apiKey && c.databaseURL && !String(c.apiKey).includes('PASTE_') && !String(c.databaseURL).includes('PASTE_'));
  }
  async function fb(){
    if(fbCache) return fbCache;
    if(!firebaseConfigured()){firebaseState='Firebase未設定・端末保存';return null;}
    try{
      const [{initializeApp,getApps},{getDatabase,ref,get,set,remove,onValue,serverTimestamp}]=await Promise.all([
        import('https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js')
      ]);
      const app=getApps().length?getApps()[0]:initializeApp(window.GAKUSHU_FIREBASE_CONFIG);
      const db=getDatabase(app);
      fbCache={db,ref,get,set,remove,onValue,serverTimestamp};
      firebaseState='Firebase DB同期ON';
      return fbCache;
    }catch(e){console.warn('Firebase init failed',e);firebaseState='Firebase接続失敗・端末保存';return null;}
  }
  function pathFor(){return 'scoreUsers/'+getUserId()+'/subjects/'+META.id}
  function readBest(){const v=localStorage.getItem(KEY); return v==null?null:Number(v)}
  async function readRemoteBest(){
    const f=await fb(); if(!f) return null;
    try{const snap=await f.get(f.ref(f.db,pathFor())); const v=snap.exists()?snap.val():null; return v&&typeof v.best==='number'?v.best:null}catch(e){console.warn(e);return null}
  }
  async function writeRemoteBest(score){
    const f=await fb(); if(!f) return;
    try{
      const p=f.ref(f.db,pathFor());
      const snap=await f.get(p); const old=snap.exists()?snap.val():null; const oldBest=old&&typeof old.best==='number'?old.best:null;
      if(oldBest==null || score>oldBest){
        await f.set(p,{best:score,subjectName:META.name,subjectId:META.id,updatedAt:f.serverTimestamp(),lastScore:score,scoreUserId:getUserId()});
        firebaseState='Firebase DB同期済';
      }else{
        // 最高点更新なしでも最終点だけ持つ
        await f.set(p,{...(old||{}),best:oldBest,subjectName:META.name,subjectId:META.id,updatedAt:f.serverTimestamp(),lastScore:score,scoreUserId:getUserId()});
        firebaseState='Firebase DB同期済';
      }
      updatePanel();
    }catch(e){console.warn('Firebase write failed',e);firebaseState='Firebase書込失敗・端末保存';updatePanel();}
  }
  async function removeRemoteBest(){const f=await fb(); if(!f)return; try{await f.remove(f.ref(f.db,pathFor())); firebaseState='Firebase DBリセット済';}catch(e){console.warn(e);firebaseState='Firebaseリセット失敗';}}
  async function syncFromRemote(){
    const rb=await readRemoteBest();
    if(rb!=null){const lb=readBest(); if(lb==null||rb>lb)localStorage.setItem(KEY,String(rb));}
    updatePanel();
  }
  async function watchRemote(){
    const f=await fb(); if(!f)return;
    try{f.onValue(f.ref(f.db,pathFor()),snap=>{const v=snap.val(); if(v&&typeof v.best==='number'){const lb=readBest(); if(lb==null||v.best>=lb)localStorage.setItem(KEY,String(v.best));}else{localStorage.removeItem(KEY)} updatePanel();});}catch(e){console.warn(e)}
  }
  function writeBest(score){
    score=Math.max(0,Math.min(100,Math.round(Number(score)||0)));
    const old=readBest();
    localStorage.setItem(LAST, JSON.stringify({score,at:new Date().toISOString(),name:META.name,scoreUserId:getUserId()}));
    if(old==null || score>old){localStorage.setItem(KEY,String(score));}
    updatePanel();
    writeRemoteBest(score);
  }
  window.__recordPeriodicTestScore=function(score){writeBest(score)};
  window.__resetPeriodicTestBest=async function(){if(confirm(META.name+' の歴代最高得点をFirebase DBごとリセットする？')){localStorage.removeItem(KEY);localStorage.removeItem(LAST);await removeRemoteBest();updatePanel();}};
  function ensurePanel(){
    if(!$(STYLE_ID)){
      const st=document.createElement('style');st.id=STYLE_ID;st.textContent=`
      .ptsPanel{position:fixed;right:10px;bottom:10px;z-index:2147483000;background:rgba(15,23,42,.92);color:#fff;border:1px solid rgba(148,163,184,.45);border-radius:16px;padding:10px 12px;box-shadow:0 12px 30px rgba(0,0,0,.35);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:270px}
      .ptsPanel b{display:block;font-size:13px;letter-spacing:.02em}.ptsBest{font-size:18px;font-weight:1000;color:#fde68a;margin-top:2px}.ptsRow{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.ptsRow button{border:0;border-radius:999px;padding:7px 9px;font-weight:900;background:#2563eb;color:white}.ptsRow button.reset{background:#475569}.ptsMini{font-size:11px;color:#cbd5e1;font-weight:800;line-height:1.35;margin-top:4px}.ptsFb{font-size:11px;color:#93c5fd;font-weight:900;margin-top:3px}@media(max-width:560px){.ptsPanel{left:8px;right:8px;bottom:6px;max-width:none;display:flex;align-items:center;justify-content:space-between;gap:8px}.ptsRow{margin-top:0}.ptsMini,.ptsFb{display:none}}`;
      document.head.appendChild(st);
    }
    if($('periodicTestPanel')) return;
    const div=document.createElement('div');div.className='ptsPanel';div.id='periodicTestPanel';div.innerHTML=`<div><b>定期テスト対策テスト</b><div class="ptsBest" id="periodicBest">最高 --点</div><div class="ptsMini">完走点をFirebase DBに歴代最高で保存</div><div class="ptsFb" id="periodicFbState">Firebase確認中</div></div><div class="ptsRow"><button type="button" id="periodicManual">今の点を記録</button><button type="button" class="reset" id="periodicReset">リセット</button></div>`;
    document.body.appendChild(div);
    $('periodicManual').onclick=()=>{const s=extractScore(); if(s==null){alert('まだ点数を検出できない。最後まで解いてから押して。');return} writeBest(s); alert(META.name+'：'+s+'点を記録した。')};
    $('periodicReset').onclick=window.__resetPeriodicTestBest;
    updatePanel();
  }
  function updatePanel(){const b=readBest(); const el=$('periodicBest'); if(el)el.textContent=b==null?'最高 --点':'最高 '+b+'点'; const fbEl=$('periodicFbState'); if(fbEl)fbEl.textContent=firebaseState+' / ID:'+getUserId();}
  function num(s){const n=Number(String(s||'').replace(/[^0-9.]/g,''));return Number.isFinite(n)?n:null}
  function scoreFromOkTotal(ok,total){ok=Number(ok);total=Number(total); if(!total||total<1)return null; return Math.round(ok/total*100)}
  function extractScore(){
    const bodyText=(document.body&&document.body.innerText)||'';
    let best=null;
    const patterns=[/正解\s*([0-9]+)\s*\/\s*([0-9]+)/g,/([0-9]+)問中\s*([0-9]+)問正解/g,/([0-9]+)\s*\/\s*([0-9]+)\s*問/g];
    for(const re of patterns){let m; while((m=re.exec(bodyText))){let a=Number(m[1]),b=Number(m[2]); let sc=null; if(re.source.startsWith('([0-9]+)問中')) sc=scoreFromOkTotal(b,a); else sc=scoreFromOkTotal(a,b); if(sc!=null)best=sc;}}
    let m=bodyText.match(/(?:得点|スコア|点数)[^0-9]{0,8}([0-9]{1,3})\s*点/); if(m)best=Math.max(0,Math.min(100,Number(m[1])));
    m=bodyText.match(/([0-9]{1,3})\s*点相当/); if(m)best=Math.max(0,Math.min(100,Number(m[1])));
    const scoreEl=$('score'); if(scoreEl){const n=num(scoreEl.textContent); if(n!=null&&n>=0&&n<=100)best=Math.round(n)}
    return best;
  }
  function completionSignal(){
    const t=(document.body&&document.body.innerText)||'';
    if(/終了|完了|最後|1周終わり|テスト終了|全問終了/.test(t)) return true;
    const qno=$('qno')?.textContent||''; const m=qno.match(/([0-9]+)\s*\/\s*([0-9]+)/); if(m&&Number(m[1])>=Number(m[2])&&Number(m[2])>0&&/正解\s*[0-9]+\s*\//.test(t))return true;
    return false;
  }
  let recordedAt=0;
  function maybeRecord(){
    if(Date.now()-recordedAt<1500)return;
    if(!completionSignal())return;
    const s=extractScore();
    if(s==null)return;
    recordedAt=Date.now(); writeBest(s);
  }
  const oldAlert=window.alert;
  window.alert=function(msg){try{if(String(msg).match(/1周終わり|終了|完了/)){setTimeout(maybeRecord,50)}}catch(e){} return oldAlert.apply(this,arguments)};
  window.addEventListener('storage',()=>syncFromRemote());
  window.addEventListener('load',()=>{ensurePanel(); syncFromRemote(); watchRemote(); setInterval(maybeRecord,1200); const mo=new MutationObserver(()=>maybeRecord()); mo.observe(document.body,{childList:true,subtree:true,characterData:true});});
})();
</script>
